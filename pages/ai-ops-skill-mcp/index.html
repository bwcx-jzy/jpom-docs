  </div> <div class="theme-vdoing-content content__default"><p>Jpom 提供两种把 AI 接入日常运维的方式，<strong>都不修改、也不嵌入 Jpom 主程序</strong>，默认只读：</p> <ul><li><strong>MCP Server（推荐）</strong>：npm 包 <code>jpom-mcp-server</code>，通过 MCP stdio 把 Jpom 的 REST 能力暴露给 Claude Desktop、Cursor、VS Code、DeepSeek Harness 等支持 MCP 的客户端；需要 Node.js ≥ 18。</li> <li><strong>jpom-ops Skill（备选）</strong>：无需 Node.js，仅需 Python 3.8+（标准库），通过 REST 脚本完成查询与受控写操作。</li></ul> <div class="custom-block warning"><p class="custom-block-title">安全提示</p> <ul><li>长期 token（请求头 <code>JPOM-USER-TOKEN</code>）只放本地环境变量或 <code>chmod 600</code> 的本地文件，<strong>不要提交到仓库、写进 URL 或截图传播</strong>。</li> <li>两种方式默认<strong>只读</strong>；写操作（触发构建、启停项目、杀进程、在线升级）必须显式开启，并在执行前回显环境/对象、获得明确同意。</li> <li>请按<strong>工作空间最小权限</strong>创建 token，并在正确环境（开发/测试/生产）操作；Jpom 操作日志可用于审计。</li></ul></div> <h2 id="支持方式"><a href="#支持方式" class="header-anchor">#</a> 支持方式</h2> <table><thead><tr><th>方式</th> <th>状态</th> <th>适用工具</th></tr></thead> <tbody><tr><td>MCP Server（<code>jpom-mcp-server</code>）</td> <td>可用（0.1.x，npm，stdio）</td> <td>Claude Desktop、Cursor、VS Code、DeepSeek Harness 等 MCP 客户端</td></tr> <tr><td><code>jpom-ops</code> Skill（指令 + REST 脚本）</td> <td>可用（REST 全能力，只读默认）</td> <td>DeepSeek Harness、Claude、Cursor、其他可加载指令/执行脚本的 Agent</td></tr></tbody></table> <p>MCP Server 与 Skill 都调用 Jpom 现有 REST API，兼容 Jpom 2.11.x。</p> <h2 id="mcp-server-推荐"><a href="#mcp-server-推荐" class="header-anchor">#</a> MCP Server（推荐）</h2> <h3 id="前置条件"><a href="#前置条件" class="header-anchor">#</a> 前置条件</h3> <ul><li>Jpom Server 2.11.x（默认端口 2122，地址以实际部署为准）</li> <li>Node.js <strong>≥ 18</strong>（<code>node -v</code> 检查）</li> <li>Jpom 长期 token：在 Jpom【用户管理 → 对应用户 → 长期 token】生成；建议单独创建一个最小权限用户/token 给 AI 使用</li></ul> <h3 id="安装与自检"><a href="#安装与自检" class="header-anchor">#</a> 安装与自检</h3> <p>无需克隆仓库，直接用 <code>npx</code> 运行：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 版本</span>
npx <span class="token parameter variable">-y</span> jpom-mcp-server <span class="token parameter variable">--version</span>

<span class="token comment"># 连通性自检（token 从 600 权限文件读取，避免写进命令历史）</span>
<span class="token assign-left variable">JPOM_BASE_URL</span><span class="token operator">=</span>http://127.0.0.1:2122 <span class="token punctuation">\</span>
<span class="token assign-left variable">JPOM_TOKEN_FILE</span><span class="token operator">=</span>/path/to/jpom-token <span class="token punctuation">\</span>
npx <span class="token parameter variable">-y</span> jpom-mcp-server doctor
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p><code>doctor</code> 成功时输出 JSON，包含 <code>&quot;ok&quot;: true</code>、<code>baseUrl</code>、<code>workspace</code>、<code>&quot;readOnly&quot;: true</code>、<code>workspaces</code> 与节点总数 <code>nodeTotal</code>。</p> <p>也可以全局安装：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> <span class="token function">install</span> <span class="token parameter variable">-g</span> jpom-mcp-server
jpom-mcp-server <span class="token parameter variable">--version</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><blockquote><p>npm 包页面：<a href="https://www.npmjs.com/package/jpom-mcp-server" target="_blank" rel="noopener noreferrer">https://www.npmjs.com/package/jpom-mcp-server<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>；源码：Jpom 仓库 <code>mcp-server/</code> 目录。</p></blockquote> <h3 id="配置项"><a href="#配置项" class="header-anchor">#</a> 配置项</h3> <table><thead><tr><th>环境变量</th> <th>必填</th> <th>说明</th></tr></thead> <tbody><tr><td><code>JPOM_BASE_URL</code></td> <td>是</td> <td>Jpom Server 地址，例如 <code>http://127.0.0.1:2122</code>；不要带尾斜杠</td></tr> <tr><td><code>JPOM_TOKEN</code></td> <td>二选一</td> <td>Jpom 长期 token；与 <code>JPOM_TOKEN_FILE</code> 同时存在时优先</td></tr> <tr><td><code>JPOM_TOKEN_FILE</code></td> <td>二选一</td> <td>存放 token 的文件路径（建议 <code>chmod 600</code>）</td></tr> <tr><td><code>JPOM_WORKSPACE</code></td> <td>否</td> <td>工作空间 ID，默认 <code>DEFAULT</code></td></tr> <tr><td><code>JPOM_READ_ONLY</code></td> <td>否</td> <td>默认 <code>true</code>；设为 <code>false</code> 才允许写工具</td></tr> <tr><td><code>JPOM_TIMEOUT_MS</code></td> <td>否</td> <td>请求超时，默认 60000</td></tr> <tr><td><code>JPOM_MAX_RESULT_CHARS</code></td> <td>否</td> <td>单次工具结果最大字符数，默认 50000</td></tr> <tr><td><code>JPOM_VERIFY_SSL</code></td> <td>否</td> <td>默认 <code>true</code>；仅自签名测试环境临时设为 <code>false</code></td></tr></tbody></table> <h3 id="mcp-客户端配置"><a href="#mcp-客户端配置" class="header-anchor">#</a> MCP 客户端配置</h3> <p>所有客户端都要在配置的 <code>env</code> 中注入上述环境变量（客户端启动 server 时不会继承终端里的全部变量），并把 token 换成自己的长期 token。</p> <h4 id="claude-desktop"><a href="#claude-desktop" class="header-anchor">#</a> Claude Desktop</h4> <p>配置文件：macOS <code>~/Library/Application Support/Claude/claude_desktop_config.json</code>；Windows <code>%APPDATA%\Claude\claude_desktop_config.json</code>。修改后完全退出并重启 Claude Desktop。</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;mcpServers&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;jpom&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token property">&quot;command&quot;</span><span class="token operator">:</span> <span class="token string">&quot;npx&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;args&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span><span class="token string">&quot;-y&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;jpom-mcp-server&quot;</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
      <span class="token property">&quot;env&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;JPOM_BASE_URL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;http://127.0.0.1:2122&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_TOKEN&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&lt;YOUR_JPOM_LONG_TERM_TOKEN&gt;&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_WORKSPACE&quot;</span><span class="token operator">:</span> <span class="token string">&quot;DEFAULT&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_READ_ONLY&quot;</span><span class="token operator">:</span> <span class="token string">&quot;true&quot;</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><h4 id="cursor"><a href="#cursor" class="header-anchor">#</a> Cursor</h4> <p>项目级 <code>.cursor/mcp.json</code> 或全局 <code>~/.cursor/mcp.json</code>：</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;mcpServers&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;jpom&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token property">&quot;command&quot;</span><span class="token operator">:</span> <span class="token string">&quot;npx&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;args&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span><span class="token string">&quot;-y&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;jpom-mcp-server&quot;</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
      <span class="token property">&quot;env&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;JPOM_BASE_URL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;http://127.0.0.1:2122&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_TOKEN&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&lt;YOUR_JPOM_LONG_TERM_TOKEN&gt;&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_WORKSPACE&quot;</span><span class="token operator">:</span> <span class="token string">&quot;DEFAULT&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_READ_ONLY&quot;</span><span class="token operator">:</span> <span class="token string">&quot;true&quot;</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><h4 id="vs-code"><a href="#vs-code" class="header-anchor">#</a> VS Code</h4> <p>工作区级 <code>.vscode/mcp.json</code>（注意字段是 <code>servers</code>，stdio 需显式 <code>type</code>）：</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;servers&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;jpom&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;stdio&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;command&quot;</span><span class="token operator">:</span> <span class="token string">&quot;npx&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;args&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span><span class="token string">&quot;-y&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;jpom-mcp-server&quot;</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
      <span class="token property">&quot;env&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;JPOM_BASE_URL&quot;</span><span class="token operator">:</span> <span class="token string">&quot;http://127.0.0.1:2122&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_TOKEN&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&lt;YOUR_JPOM_LONG_TERM_TOKEN&gt;&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_WORKSPACE&quot;</span><span class="token operator">:</span> <span class="token string">&quot;DEFAULT&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;JPOM_READ_ONLY&quot;</span><span class="token operator">:</span> <span class="token string">&quot;true&quot;</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><blockquote><p>DeepSeek Harness 的 MCP 配置是插件配置树（YAML，<code>@deepseek-ai/dsh-mcp-client</code>），不是 <code>mcpServers</code> JSON；示例见源码 <code>skills/jpom-ops/adapters/dsh/README.md</code>。</p></blockquote> <h3 id="工具能力"><a href="#工具能力" class="header-anchor">#</a> 工具能力</h3> <p>MCP Server 提供 54 个工具（47 个只读 + 6 个受控写 + 1 个通用 REST 调用），按域覆盖：</p> <table><thead><tr><th>域</th> <th>主要能力</th></tr></thead> <tbody><tr><td>节点</td> <td>节点/分组、监控数据、进程列表、机器信息</td></tr> <tr><td>项目</td> <td>节点上的项目列表与详情</td></tr> <tr><td>构建</td> <td>构建配置/详情/历史/分组、仓库与分支</td></tr> <tr><td>脚本</td> <td>服务端脚本与节点脚本、执行记录</td></tr> <tr><td>资产</td> <td>机器、SSH、FTP、Docker 资产</td></tr> <tr><td>监控与分发</td> <td>项目监控、分发任务与执行日志</td></tr> <tr><td>系统</td> <td>系统信息、版本检查、备份、集群、受管日志</td></tr> <tr><td>用户与审计</td> <td>用户、权限组、登录日志、操作日志、最近操作</td></tr> <tr><td>日志</td> <td>系统/节点日志快照与实时跟随、项目日志、构建/脚本日志行游标</td></tr></tbody></table> <p>日志类工具按“快照 + 游标 + 有界跟随”设计，适合 AI 上下文：</p> <ul><li>先 <code>jpom_system_log_files</code> 找文件，再用 <code>jpom_system_log_read</code> 取尾部或按关键词过滤（默认最多处理 5 MiB）；</li> <li>构建/脚本日志用 <code>jpom_build_log</code> / <code>jpom_script_log</code> / <code>jpom_node_script_log</code>，按返回的 <code>nextLine</code> 继续读；</li> <li><code>jpom_system_log_follow</code> / <code>jpom_project_log_follow</code> 只收集短时窗口（默认 3 秒、最多 15 秒），不是无限流。</li></ul> <h3 id="写操作-默认禁用"><a href="#写操作-默认禁用" class="header-anchor">#</a> 写操作（默认禁用）</h3> <p>写工具在 <code>JPOM_READ_ONLY=true</code>（默认）时直接拒绝，且不会发出请求；需要时显式改为 <code>false</code>：</p> <table><thead><tr><th>工具</th> <th>说明</th></tr></thead> <tbody><tr><td><code>jpom_build_start</code> / <code>jpom_build_cancel</code> / <code>jpom_build_rerelease</code></td> <td>触发/取消/按历史重发构建</td></tr> <tr><td><code>jpom_project_operate</code></td> <td>项目启停重启（start/stop/restart）</td></tr> <tr><td><code>jpom_node_kill_pid</code></td> <td>结束节点上的进程（高危）</td></tr> <tr><td><code>jpom_system_upgrade</code></td> <td>在线升级（最高风险，可能重启 Server）</td></tr></tbody></table> <div class="custom-block warning"><p class="custom-block-title">注意</p> <p>开启写操作前请确认当前环境（开发/测试/生产）、工作空间、对象 ID 与动作；优先使用最小、可回滚的操作，执行后再回读状态确认。不要把 <code>JPOM_READ_ONLY</code> 长期设为 <code>false</code>。</p></div> <h3 id="常见问题"><a href="#常见问题" class="header-anchor">#</a> 常见问题</h3> <ul><li><strong><code>doctor</code> 返回 <code>code=800</code></strong>：token 无效或已过期（修改密码后旧 token 失效），重新生成长期 token。</li> <li><strong>返回 <code>code=999</code></strong>：权限不足，检查 token 用户的工作空间与权限组、<code>JPOM_WORKSPACE</code> 是否正确。</li> <li><strong>连接失败/超时</strong>：检查 <code>JPOM_BASE_URL</code>、端口、Jpom 是否启动、context-path、网络/代理；<code>JPOM_TIMEOUT_MS</code> 过小也会超时。</li> <li><strong>客户端看不到 <code>jpom_*</code> 工具</strong>：查看客户端 MCP 日志与 server 的 stderr；确认 <code>command/args</code> 可执行、Node ≥ 18、<code>env</code> 已注入、修改配置后客户端已重启。</li> <li><strong>结果被截断</strong>：缩小 <code>limit</code>/<code>maxLines</code>、使用日志的 <code>grep</code>/关键词过滤，或分段读取。</li></ul> <h2 id="jpom-ops-skill-备选"><a href="#jpom-ops-skill-备选" class="header-anchor">#</a> jpom-ops Skill（备选）</h2> <p>如果运行环境没有 Node.js，可使用 Skill 方式：通过 <code>jpom_api.py</code>（Python 3.8+，仅标准库）调用 Jpom REST API。</p> <ul><li>下载 Skill 包：<a href="/downloads/ai-skills/jpom-ops-skill.zip">/downloads/ai-skills/jpom-ops-skill.zip</a></li> <li>源码：Jpom 仓库 <code>skills/jpom-ops/</code></li> <li>使用：把 <code>SKILL.md</code> 作为 AI 工具的项目指令/规则，并允许其执行 <code>scripts/jpom_api.py</code></li></ul> <h3 id="快速开始"><a href="#快速开始" class="header-anchor">#</a> 快速开始</h3> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">export</span> <span class="token assign-left variable">JPOM_BASE_URL</span><span class="token operator">=</span>http://127.0.0.1:2122
<span class="token builtin class-name">export</span> <span class="token assign-left variable">JPOM_TOKEN_FILE</span><span class="token operator">=</span>/path/to/jpom-token   <span class="token comment"># chmod 600；或使用 JPOM_TOKEN</span>
<span class="token builtin class-name">export</span> <span class="token assign-left variable">JPOM_WORKSPACE</span><span class="token operator">=</span>DEFAULT

./scripts/jpom-api.sh capabilities           <span class="token comment"># 能力清单</span>
./scripts/jpom-api.sh workspaces             <span class="token comment"># 校验 token</span>
./scripts/jpom-api.sh nodes
./scripts/jpom-api.sh build-history
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>Windows（cmd / PowerShell）：</p> <div class="language-bat line-numbers-mode"><pre class="language-text"><code>set JPOM_BASE_URL=http://127.0.0.1:2122
set JPOM_TOKEN_FILE=C:\path\jpom-token
set JPOM_WORKSPACE=DEFAULT
python scripts\jpom_api.py capabilities
python scripts\jpom_api.py nodes --limit 5
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="能力与写操作"><a href="#能力与写操作" class="header-anchor">#</a> 能力与写操作</h3> <table><thead><tr><th>域</th> <th>命令</th></tr></thead> <tbody><tr><td>工作空间</td> <td><code>workspaces</code> <code>workspace-list</code> <code>workspace-env</code></td></tr> <tr><td>节点</td> <td><code>nodes</code> <code>node-groups</code> <code>node-machine-info</code> <code>node-monitor</code> <code>node-process</code></td></tr> <tr><td>项目</td> <td><code>projects</code> <code>project-info</code></td></tr> <tr><td>构建</td> <td><code>builds</code> <code>build-get</code> <code>build-history</code> <code>build-log</code> <code>build-groups</code> <code>repositories</code> <code>repository-groups</code> <code>branches</code></td></tr> <tr><td>脚本</td> <td><code>scripts</code> <code>scripts-all</code> <code>script-logs</code> <code>node-scripts</code> <code>node-script-logs</code></td></tr> <tr><td>资产</td> <td><code>machines</code> <code>ssh-assets</code> <code>ftp-assets</code> <code>docker-assets</code></td></tr> <tr><td>监控/分发/系统</td> <td><code>monitors</code> <code>dispatch</code> <code>dispatch-logs</code> <code>system-info</code> <code>check-version</code> <code>server-logs</code> <code>backups</code> <code>clusters</code></td></tr> <tr><td>用户与审计</td> <td><code>users</code> <code>permission-groups</code> <code>login-logs</code> <code>operate-logs</code> <code>recent-logs</code> <code>log-read</code></td></tr></tbody></table> <p>写操作默认禁用（<code>JPOM_OPS_ALLOW_WRITE=true</code> + <code>--confirm</code>）：<code>build-start</code>、<code>build-cancel</code>、<code>build-rerelease</code>、<code>project-operate</code>、<code>node-kill-pid</code>、<code>system-upgrade</code>。</p> <h3 id="不在范围"><a href="#不在范围" class="header-anchor">#</a> 不在范围</h3> <p>终端（SSH / Docker CLI / 节点控制台）、脚本在线执行、文件浏览与上传、用户/权限/系统配置写操作——属于 WebSocket 交互通道或高风险管理面，不适合交给 AI 自动执行；MCP Server 同样不提供这些能力。</p> <h2 id="选择建议"><a href="#选择建议" class="header-anchor">#</a> 选择建议</h2> <table><thead><tr><th>场景</th> <th>推荐方式</th></tr></thead> <tbody><tr><td>Claude Desktop / Cursor / VS Code 等原生 MCP 客户端</td> <td><strong>MCP Server</strong></td></tr> <tr><td>DeepSeek Harness / 已有 Skill 体系的 Agent</td> <td>MCP Server 或 Skill 均可</td></tr> <tr><td>机器上没有 Node.js（只有 Python）</td> <td>Skill</td></tr> <tr><td>需要工具级参数校验、结构化结果、默认只读闸门</td> <td>MCP Server</td></tr></tbody></table></div></div> <div class="page-slot page-slot-bottom">
