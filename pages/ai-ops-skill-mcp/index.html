  </div> <div class="theme-vdoing-content content__default"><p>Jpom 提供可移植的 AI 运维 Skill（<code>jpom-ops</code>）：通过现有 REST API + 长期 token 完成工作空间、节点、项目、构建、脚本、资产、监控、分发、系统与日志的查询，并支持<strong>显式授权后</strong>的受控写操作。MCP Server 规划中。</p> <div class="custom-block warning"><p class="custom-block-title">安全提示</p> <ul><li>长期 token（请求头 <code>JPOM-USER-TOKEN</code>）只放本地环境变量或 <code>chmod 600</code> 的本地文件，<strong>不要提交到仓库或截图传播</strong>。</li> <li>默认<strong>只读</strong>。写操作（触发构建、启停项目、杀进程、在线升级）必须同时满足 <code>JPOM_OPS_ALLOW_WRITE=true</code> 与 <code>--confirm</code>，执行前须回显环境/对象并获明确同意。</li> <li>请按<strong>工作空间最小权限</strong>创建 token，并在正确环境（开发/测试/生产）操作；Jpom 操作日志可用于审计。</li></ul></div> <h2 id="支持方式"><a href="#支持方式" class="header-anchor">#</a> 支持方式</h2> <table><thead><tr><th>方式</th> <th>状态</th> <th>适用工具</th></tr></thead> <tbody><tr><td><code>jpom-ops</code> Skill（指令 + REST 脚本）</td> <td>可用（REST 全能力，只读默认）</td> <td>DeepSeek Harness、Claude、Cursor、其他可加载指令/执行脚本的 Agent</td></tr> <tr><td>MCP Server（独立 sidecar）</td> <td>规划中</td> <td>Claude Desktop、Cursor、VS Code MCP 客户端等</td></tr></tbody></table> <p>Skill 不修改 Jpom 主程序，仅调用 Jpom REST API（已在 2.11.13 逐条验证，兼容 2.11.x）。</p> <h2 id="下载与源码"><a href="#下载与源码" class="header-anchor">#</a> 下载与源码</h2> <ul><li>下载 Skill 包：<a href="/downloads/ai-skills/jpom-ops-skill.zip">/downloads/ai-skills/jpom-ops-skill.zip</a></li> <li>源码位置（随 Jpom 代码仓库维护）：<code>jpom-parent/skills/jpom-ops/</code></li></ul> <h2 id="快速开始"><a href="#快速开始" class="header-anchor">#</a> 快速开始</h2> <p>Skill 脚本为<strong>跨平台</strong>实现：<code>scripts/jpom_api.py</code>（Python 3.8+，仅标准库）；Linux/macOS 可直接用薄包装 <code>scripts/jpom-api.sh</code>。</p> <p><strong>Linux / macOS</strong></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">export</span> <span class="token assign-left variable">JPOM_BASE_URL</span><span class="token operator">=</span>http://127.0.0.1:2122   <span class="token comment"># Jpom Server 地址</span>
<span class="token builtin class-name">export</span> <span class="token assign-left variable">JPOM_TOKEN_FILE</span><span class="token operator">=</span>/path/to/jpom-token   <span class="token comment"># chmod 600；或使用 JPOM_TOKEN</span>
<span class="token builtin class-name">export</span> <span class="token assign-left variable">JPOM_WORKSPACE</span><span class="token operator">=</span>DEFAULT

./scripts/jpom-api.sh capabilities           <span class="token comment"># 能力清单</span>
./scripts/jpom-api.sh workspaces             <span class="token comment"># 校验 token</span>
./scripts/jpom-api.sh nodes
./scripts/jpom-api.sh projects --node-id <span class="token operator">&lt;</span>节点ID<span class="token operator">&gt;</span>
./scripts/jpom-api.sh build-history
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p><strong>Windows（cmd / PowerShell）</strong></p> <div class="language-bat line-numbers-mode"><pre class="language-text"><code>set JPOM_BASE_URL=http://127.0.0.1:2122
set JPOM_TOKEN_FILE=C:\path\jpom-token
set JPOM_WORKSPACE=DEFAULT
python scripts\jpom_api.py capabilities
python scripts\jpom_api.py nodes --limit 5
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>然后在 AI 工具中加载 <code>SKILL.md</code>（并允许其执行上述命令），即可用自然语言查询与巡检。</p> <h2 id="能力覆盖-rest"><a href="#能力覆盖-rest" class="header-anchor">#</a> 能力覆盖（REST）</h2> <table><thead><tr><th>域</th> <th>命令</th></tr></thead> <tbody><tr><td>工作空间</td> <td><code>workspaces</code> <code>workspace-list</code> <code>workspace-env</code></td></tr> <tr><td>节点</td> <td><code>nodes</code> <code>node-groups</code> <code>node-machine-info</code> <code>node-monitor</code> <code>node-process</code></td></tr> <tr><td>项目</td> <td><code>projects</code> <code>project-info</code></td></tr> <tr><td>构建</td> <td><code>builds</code> <code>build-get</code> <code>build-history</code> <code>build-log</code> <code>build-groups</code> <code>repositories</code> <code>repository-groups</code> <code>branches</code></td></tr> <tr><td>脚本</td> <td><code>scripts</code> <code>scripts-all</code> <code>script-logs</code> <code>node-scripts</code> <code>node-script-logs</code></td></tr> <tr><td>资产</td> <td><code>machines</code> <code>ssh-assets</code> <code>ftp-assets</code> <code>docker-assets</code></td></tr> <tr><td>监控/分发/系统</td> <td><code>monitors</code> <code>dispatch</code> <code>dispatch-logs</code> <code>system-info</code> <code>check-version</code> <code>server-logs</code> <code>backups</code> <code>clusters</code></td></tr> <tr><td>用户与审计</td> <td><code>users</code> <code>permission-groups</code> <code>login-logs</code> <code>operate-logs</code> <code>recent-logs</code> <code>log-read</code></td></tr></tbody></table> <h3 id="受控写操作-默认禁用"><a href="#受控写操作-默认禁用" class="header-anchor">#</a> 受控写操作（默认禁用）</h3> <table><thead><tr><th>命令</th> <th>说明</th></tr></thead> <tbody><tr><td><code>build-start --id &lt;buildId&gt; [--branch-name x]</code></td> <td>触发构建</td></tr> <tr><td><code>build-cancel --id &lt;buildId&gt;</code></td> <td>取消构建</td></tr> <tr><td><code>build-rerelease --log-id &lt;logId&gt;</code></td> <td>按历史记录重新发布</td></tr> <tr><td><code>project-operate --node-id &lt;nid&gt; --id &lt;pid&gt; --opt start\|stop\|restart</code></td> <td>项目启停重启</td></tr> <tr><td><code>node-kill-pid --node-id &lt;nid&gt; --pid &lt;pid&gt;</code></td> <td>结束节点进程</td></tr> <tr><td><code>system-upgrade [--machine-id &lt;id&gt;]</code></td> <td>在线升级（真实触发，最高风险）</td></tr></tbody></table> <p>开启方式：<code>export JPOM_OPS_ALLOW_WRITE=true</code>，并在命令后加 <code>--confirm</code>。脚本会拒绝未授权或未确认的写操作（分别返回 <code>rc=3</code> / <code>rc=4</code>）。</p> <div class="custom-block tip"><p class="custom-block-title">验证状态</p> <p>以上写命令已在 Jpom 2.11.13 开发环境真实执行验证：触发构建成功（status=2）、取消长任务（status=7）、按历史重建、项目启停重启（真实 PID 变化）、结束指定进程。<code>system-upgrade</code> 仅验证安全闸门，<strong>未真实触发升级</strong>，请谨慎使用。</p></div> <h3 id="不在范围-请使用-web-ui"><a href="#不在范围-请使用-web-ui" class="header-anchor">#</a> 不在范围（请使用 Web UI）</h3> <p>终端（SSH / Docker CLI / 节点控制台）、脚本在线执行、文件浏览与上传、用户/权限/系统配置写操作——属于 WebSocket 交互通道或高风险管理面，不适合交给 AI 自动执行。</p> <h2 id="各-ai-工具适配"><a href="#各-ai-工具适配" class="header-anchor">#</a> 各 AI 工具适配</h2> <ul><li><strong>DeepSeek Harness</strong>：安装 <code>jpom-ops</code> 到 DSH 可发现的 skills 目录，配置 <code>JPOM_*</code> 环境变量。</li> <li><strong>Claude / Cursor</strong>：MVP 阶段将 <code>SKILL.md</code> 作为项目指令/规则；MCP Server 发布后可使用 <code>adapters/claude-desktop/</code>、<code>adapters/cursor/</code> 的配置示例（<code>JPOM_READ_ONLY=true</code>）。</li> <li><strong>VS Code MCP 客户端</strong>：MCP Server 发布后按 <code>adapters/vscode-mcp/</code> 配置。</li> <li><strong>注意</strong>：<code>adapters/</code> 中的 <code>mcp*.json</code> 示例指向尚未发布的 <code>jpom-mcp-server</code>，仅作配置参考、<strong>当前不可直接使用</strong>；MVP 阶段请用 Skill 方式。</li></ul> <h2 id="常见问题"><a href="#常见问题" class="header-anchor">#</a> 常见问题</h2> <ul><li><strong><code>code=800</code>/鉴权失败</strong>：token 无效或修改密码后失效，重新生成长期 token；可设 <code>JPOM_STRICT_CODE=1</code> 让脚本以非 0 退出。</li> <li><strong><code>code=405</code> 对象不存在</strong>：如构建 ID、记录 ID 不存在；先用列表命令取正确 ID。</li> <li><strong><code>500 No corresponding resource found</code></strong>：接口路径与版本/部署（context-path）不匹配，按实际版本校正。</li> <li><strong>无数据/权限不足</strong>：检查 <code>JPOM_WORKSPACE</code>、token 权限与分页参数。</li> <li><strong>连接失败</strong>：检查 <code>JPOM_BASE_URL</code>、端口（默认 2122）、网络与代理。</li></ul></div></div> <div class="page-slot page-slot-bottom">
