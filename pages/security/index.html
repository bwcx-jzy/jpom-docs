  </div> <div class="theme-vdoing-content content__default"><h1 id="jpom-安全公告"><a href="#jpom-安全公告" class="header-anchor">#</a> Jpom 安全公告</h1> <blockquote><p>本页是 Jpom 官方安全公告的统一入口，用于集中发布已修复安全问题的<strong>受影响版本、修复版本、升级方式与防护建议</strong>。
公告只描述修复与防护信息，<strong>不包含漏洞利用细节</strong>。</p></blockquote> <h2 id="最新公告"><a href="#最新公告" class="header-anchor">#</a> 最新公告</h2> <h3 id="_2-11-13-安全修复公告-2026-11-07"><a href="#_2-11-13-安全修复公告-2026-11-07" class="header-anchor">#</a> 2.11.13 安全修复公告（2026-11-07）</h3> <div class="custom-block danger"><p class="custom-block-title">请尽快升级</p> <p><strong>Jpom 2.11.12 及更早版本均受本次安全问题影响</strong>，其中包含 CVSS 9.8 的严重问题。
<strong>2.11.13 已完整修复</strong>，请使用旧版本的用户尽快升级。</p></div> <table><thead><tr><th>项</th> <th>内容</th></tr></thead> <tbody><tr><td>公告</td> <td><a href="/pages/security/2.11.13/">Jpom 2.11.13 安全修复公告</a></td></tr> <tr><td>发布日期</td> <td>2026-11-07</td></tr> <tr><td>受影响版本</td> <td><strong>2.11.12 及更早版本</strong>（Server / Agent）</td></tr> <tr><td>修复版本</td> <td><strong>2.11.13</strong>（2026-11-07 发布）</td></tr> <tr><td>风险等级</td> <td>严重（最高 CVSS 9.8）</td></tr> <tr><td>涉及问题</td> <td>CVE-2026-120201、CVE-2026-111605、CVE-2026-91993、QVD-2026-45876，以及多项安全加固</td></tr></tbody></table> <h2 id="公告列表"><a href="#公告列表" class="header-anchor">#</a> 公告列表</h2> <table><thead><tr><th>公告</th> <th>发布日期</th> <th>修复版本</th> <th>受影响版本</th></tr></thead> <tbody><tr><td><a href="/pages/security/2.11.13/">Jpom 2.11.13 安全修复公告</a></td> <td>2026-11-07</td> <td>2.11.13</td> <td>≤ 2.11.12</td></tr></tbody></table> <h2 id="维护与支持说明"><a href="#维护与支持说明" class="header-anchor">#</a> 维护与支持说明</h2> <ul><li>Jpom 自 <strong>2026-02-05</strong> 起暂停<strong>常规功能迭代</strong>，但<strong>安全维护仍在继续</strong>；安全问题的评估与修复不受“暂停维护”影响。</li> <li>安全修复只针对最新稳定版发布。本次修复版本为 <strong>2.11.13</strong>，建议所有使用 2.11.12 及更早版本的用户升级；继续使用旧版本将无法获得后续安全修复。</li> <li>安全问题请优先邮件报告：<strong>bwcx_jzy@dromara.org</strong>；请勿在公开 issue 中粘贴未修复漏洞的利用细节、凭据或内网信息。非敏感的低危问题可以先提 issue 讨论。</li></ul> <h2 id="如何获取安全更新"><a href="#如何获取安全更新" class="header-anchor">#</a> 如何获取安全更新</h2> <ol><li><strong>在线升级（推荐）</strong>：登录服务端 → 系统管理 → 在线升级，检查并升级到 <code>2.11.13</code>；插件端可在节点管理中批量升级。</li> <li><strong>手动下载</strong>：在<a href="/pages/all-downloads/">下载中心</a>下载 <code>2.11.13</code> 安装包（<code>d2.jpom.download</code>），升级步骤见<a href="/pages/FQA/upgrade/">升级版本</a>。</li> <li><strong>Docker 镜像</strong>：<code>jpomdocker/jpom:2.11.13</code>、<code>jpomdocker/jpom-agent:2.11.13</code>（<code>latest</code> 自 2026-11-07 起指向 2.11.13）。</li> <li><strong>发行版页面</strong>：<a href="https://gitee.com/dromara/Jpom/releases/tag/v2.11.13" target="_blank" rel="noopener noreferrer">Gitee Release<span><svg xmlns="http://www.w
