  </div> <div class="theme-vdoing-content content__default"><h1 id="jpom-2-11-13-安全修复公告"><a href="#jpom-2-11-13-安全修复公告" class="header-anchor">#</a> Jpom 2.11.13 安全修复公告</h1> <blockquote><p>发布日期：<strong>2026-11-07</strong> ｜ 修复版本：<strong>2.11.13</strong> ｜ 受影响版本：<strong>2.11.12 及更早版本</strong>（其中 CVE-2026-120201 为 <strong>2.10.0–2.11.12</strong>）
适用对象：所有使用 Jpom 服务端（Server）与插件端（Agent）的用户
本公告只描述受影响范围、修复情况与防护建议，<strong>不包含漏洞利用细节</strong>。</p></blockquote> <h2 id="_1-结论"><a href="#_1-结论" class="header-anchor">#</a> 1. 结论</h2> <ul><li><strong>受影响的版本</strong>：<code>2.11.12</code> 及更早的所有版本（Server 与 Agent）；其中 <strong>CVE-2026-120201 影响 <code>2.10.0</code>–<code>2.11.12</code></strong>。</li> <li><strong>已修复版本</strong>：<code>2.11.13</code>，于 <strong>2026-11-07</strong> 发布（稳定版）。</li> <li><strong>风险等级</strong>：严重。本次共修复 3 个已分配 CVE 编号的漏洞（最高 <strong>CVSS 9.8</strong>，未授权即可接管管理员权限）和 1 个依赖组件远程代码执行风险（QVD-2026-45876），另包含多项安全加固。</li> <li><strong>建议动作</strong>：<strong>立即升级到 <code>2.11.13</code></strong>。无法立即升级的，请按第 7 节做临时缓解，并按第 8 节排查处置。</li></ul> <div class="custom-block danger"><p class="custom-block-title">重要</p> <p>Jpom 自 2026-02-05 起暂停的是<strong>常规功能迭代</strong>；本次 <strong><code>2.11.13</code> 安全修复版已发布</strong>，旧版本不会再获得本次修复。<strong>安全维护仍在继续</strong>，后续安全问题的处理请关注本安全公告。</p></div> <h2 id="_2-已修复的安全问题"><a href="#_2-已修复的安全问题" class="header-anchor">#</a> 2. 已修复的安全问题</h2> <table><thead><tr><th>编号</th> <th>风险等级</th> <th>问题说明</th> <th>受影响版本</th> <th>修复版本</th></tr></thead> <tbody><tr><td>CVE-2026-120201</td> <td>严重（CVSS 9.8）</td> <td>用户身份校验缺陷：未授权的请求可能被错误识别为管理员，导致<strong>管理员权限被接管</strong>（对应早期报告的 <code>JPOM-USER-TOKEN</code> 校验问题）</td> <td>2.10.0–2.11.12</td> <td>2.11.13</td></tr> <tr><td>CVE-2026-111605</td> <td>高危（CVSS 8.1）</td> <td>SSH 文件管理接口未校验资产所属工作空间，可能造成<strong>跨工作区的 SSH 文件读取与写入</strong>（同类 FTP 文件接口已一并修复）</td> <td>≤ 2.11.12</td> <td>2.11.13</td></tr> <tr><td>CVE-2026-91993</td> <td>中危（CVSS 4.3）</td> <td>构建仓库相关接口未校验工作空间归属，可能造成<strong>跨工作区的仓库信息访问</strong></td> <td>≤ 2.11.12</td> <td>2.11.13</td></tr> <tr><td>QVD-2026-45876</td> <td>高危</td> <td>内置依赖 <code>fastjson2</code> 的 AutoType 绕过问题可导致<strong>远程代码执行</strong>（影响 <code>fastjson2</code> ≤ 2.0.62）；2.11.13 已将 <code>fastjson2</code> 升级到 2.0.66</td> <td>≤ 2.11.12</td> <td>2.11.13</td></tr></tbody></table> <div class="custom-block tip"><p class="custom-block-title">关于版本区间</p> <p>上表中除 CVE-2026-120201（影响 2.10.0–2.11.12）外，“≤ 2.11.12”指以受影响依赖/代码构建的全部历史版本。若您使用的版本更旧，同样建议升级到 2.11.13。若跨大版本升级（如从 2.10.x 升级），升级前请先阅读对应的迁移指南：<a href="/pages/upgrade/2.10.x-to-2.11.x/">2.10.x 升级到 2.11.x</a>。</p></div> <h2 id="_3-其他安全加固"><a href="#_3-其他安全加固" class="header-anchor">#</a> 3. 其他安全加固</h2> <p>除上述 CVE 外，2.11.13 还包含以下安全收紧（均已在 CHANGELOG 中公开）：</p> <ul><li><strong>JWT 签名密钥随机化</strong>：未配置 <code>jpom.user.token-jwt-key</code> 时不再回退到源码中的固定值，首次启动自动生成随机密钥并持久化到 <code>&lt;data&gt;/.jwt-key</code>（权限 600）；空白配置同样视为未配置。</li> <li><strong>可信代理校验</strong>：新增 <code>jpom.web.trusted-proxies</code>，修复伪造 <code>X-Forwarded-For</code> / <code>X-Real-IP</code> 绕过 IP 白名单与登录 IP 失败锁定的问题。</li> <li><strong>插件端授权密码保护</strong>：Agent 自动生成的授权密码不再明文写入日志，<code>data/agent_authorize.json</code> 权限收紧为 600。</li> <li><strong><code>/tools</code> 网络工具收紧</strong>：<code>/tools/net-ping</code>、<code>/tools/net-telnet</code>、<code>/tools/ip-list</code> 改为仅系统管理员可用，并限制端口/超时、增加操作日志；普通用户仍可使用 Cron 工具。</li> <li><strong>登录验证码加固</strong>：验证码校验前移并改为一次性、5 分钟有效；账号不存在与密码错误统一返回，降低账号枚举风险。</li> <li><strong>系统初始化校验</strong>：初始化接口补充用户名、密码参数校验，避免异常请求创建管理员账号。</li> <li><strong>数据库查询加固</strong>：主键条件以及分页过滤、排序字段统一使用占位符绑定和字段名白名单校验，降低查询条件注入风险。</li> <li><strong>依赖升级</strong>：Tomcat 9.0.123、JGit、BouncyCastle、commons-lang3、fastjson2 等依赖升级，修复其已知安全漏洞。</li> <li><strong>信息暴露收敛</strong>：节点监控异常通知不再包含完整异常堆栈。</li></ul> <h2 id="_4-影响范围"><a href="#_4-影响范围" class="header-anchor">#</a> 4. 影响范围</h2> <ul><li>部署了 <strong>2.11.12 及更早版本</strong> Jpom 服务端（Server）的实例。</li> <li>部署了 <strong>2.11.12 及更早版本</strong> Jpom 插件端（Agent）的实例（建议与服务端同步升级）。</li> <li>以下场景风险更高，请优先处理：
<ul><li>服务端端口 <code>2122</code> / 插件端端口 <code>2123</code> 可直接从公网访问；</li> <li>多用户、多工作空间、多人协作的环境；</li> <li>开启了 OpenAPI 或对外提供了 API 调用入口；</li> <li>服务端所在主机上还存在其他重要数据或凭据。</li></ul></li></ul> <div class="custom-block warning"><p class="custom-block-title">注意</p> <p>本次包含“未授权即可利用”的严重问题，<strong>即使系统只在内网使用也建议升级</strong>；依赖组件风险也不依赖有效登录凭据，可能被未授权请求触发。</p></div> <h2 id="_5-升级方式"><a href="#_5-升级方式" class="header-anchor">#</a> 5. 升级方式</h2> <blockquote><p>升级前请先备份数据目录（默认 <code>data/</code>）与配置文件（<code>conf/</code>），并阅读第 6 节注意事项。</p></blockquote> <h3 id="_5-1-在线升级-推荐"><a href="#_5-1-在线升级-推荐" class="header-anchor">#</a> 5.1 在线升级（推荐）</h3> <ol><li>使用系统管理员登录服务端。</li> <li>进入 <strong>系统管理 → 在线升级</strong>，点击检查更新，确认目标版本为 <code>2.11.13</code>。</li> <li>点击升级服务端，等待重启完成（通常 1 分钟内）。</li> <li>进入 <strong>节点管理</strong>，对插件端执行批量升级（或逐个节点更新），确保 Agent 与服务端版本一致。</li> <li>刷新页面，在 <strong>系统管理 → 关于/版本信息</strong> 中确认版本为 <code>2.11.13</code>。</li></ol> <p>详细说明：<a href="/pages/FQA/upgrade/">升级版本</a></p> <div class="custom-block tip"><p class="custom-block-title">检测不到新版本</p> <p>2.11.12 及更早版本的在线升级功能通常可以检测到 2.11.13。若因网络、证书或旧版本自身问题检测不到，请使用 5.2 手动下载升级。</p></div> <h3 id="_5-2-手动下载升级"><a href="#_5-2-手动下载升级" class="header-anchor">#</a> 5.2 手动下载升级</h3> <ol><li>打开<a href="/pages/all-downloads/">下载中心</a>，选择 <code>2.11.13</code>，下载与服务端/插件端对应的安装包，并校验 <code>.sha1</code>。</li> <li>停止服务，备份数据与配置。</li> <li>替换安装包/<code>jar</code>，启动服务。</li> <li>确认版本为 <code>2.11.13</code>，检查节点在线与业务功能。</li></ol> <p>服务端/插件端升级命令与手动替换步骤见<a href="/pages/FQA/upgrade/">升级版本</a>。</p> <div class="custom-block danger"><p class="custom-block-title">下载域名</p> <p>旧下载域名 <code>d.jpom.download</code> <strong>已停用</strong>，请使用新域名 <strong><code>d2.jpom.download</code></strong>；请从<a href="/pages/all-downloads/">下载中心</a>进入，谨防仿冒站点。</p></div> <h3 id="_5-3-docker-镜像"><a href="#_5-3-docker-镜像" class="header-anchor">#</a> 5.3 Docker 镜像</h3> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 服务端（请替换容器名、端口与数据目录挂载为你自己的配置）</span>
<span class="token function">docker</span> pull jpomdocker/jpom:2.11.13
<span class="token comment"># 插件端</span>
<span class="token function">docker</span> pull jpomdocker/jpom-agent:2.11.13
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><ul><li><code>latest</code> 标签自 2026-11-07 起指向 <code>2.11.13</code>，但生产环境建议使用固定版本标签。</li> <li>容器升级时请确保<strong>数据目录已挂载到宿主机</strong>，再重新创建容器，避免数据丢失；未挂载时先备份容器内数据。</li> <li>容器安装与挂载说明：<a href="/pages/820286/">容器安装</a></li></ul> <h2 id="_6-升级注意事项"><a href="#_6-升级注意事项" class="header-anchor">#</a> 6. 升级注意事项</h2> <ol><li><strong>升级后可能需要重新登录</strong>：未配置 <code>jpom.user.token-jwt-key</code> 的实例，升级后会自动生成 <code>&lt;data&gt;/.jwt-key</code>，旧的登录 token 失效，需要重新登录；<strong>集群部署必须为所有节点显式配置相同的 key</strong>。建议显式配置至少 32 位随机 <code>jpom.user.token-jwt-key</code>，并在升级后确认登录正常。</li> <li><strong>反向代理环境</strong>：如果反向代理不在本机，请把代理地址配置到 <code>jpom.web.trusted-proxies</code>。否则 IP 白名单和登录 IP 失败锁定看到的是代理 IP——这是本次安全收紧，不是升级故障。</li> <li><strong><code>/tools</code> 权限变化</strong>：<code>/tools/net-ping</code>、<code>/tools/net-telnet</code>、<code>/tools/ip-list</code> 现在仅系统管理员可见/可用，普通用户菜单会隐藏；普通用户的 Cron 工具不受影响。</li> <li><strong>验证码变化</strong>：验证码改为一次性、5 分钟有效；失败或过期后需要重新获取，账号不存在与密码错误统一提示。</li> <li><strong>服务端与插件端版本尽量保持一致</strong>，避免出现数据字段/接口不匹配问题。</li> <li><strong>先在测试环境验证</strong>，尤其是使用了反向代理、集群、OpenAPI 或自定义集成脚本的环境。</li></ol> <h2 id="_7-无法立即升级时的临时缓解"><a href="#_7-无法立即升级时的临时缓解" class="header-anchor">#</a> 7. 无法立即升级时的临时缓解</h2> <div class="custom-block danger"><p class="custom-block-title">缓解不等于修复</p> <p>以下措施只能降低被利用的概率，<strong>不能替代升级到 2.11.13</strong>。请尽快安排升级窗口。</p></div> <ul><li><strong>收敛网络暴露面</strong>：不要把 <code>2122</code> / <code>2123</code> 直接暴露到公网；使用防火墙/安全组白名单、VPN 或带认证的反向代理访问。</li> <li><strong>限制 API 入口</strong>：关闭或限制 OpenAPI，并轮换已发放的 OpenAPI token；限制可访问来源 IP。</li> <li><strong>在反向代理/WAF 上拦截异常请求</strong>：对异常的 <code>JPOM-USER-TOKEN</code> 请求、可疑的批量 API 请求增加拦截或告警规则（只能作为兜底，无法阻止全部利用方式）。</li> <li><strong>收紧账号与权限</strong>：为所有账号开启 MFA；删除不再使用的账号，按最小权限收回管理员权限；限制工作空间成员。</li> <li><strong>轮换敏感凭据</strong>：修改管理员密码、插件端授权密码、<code>jpom.user.token-jwt-key</code>（修改后旧 token 全部失效）、SSH/FTP/Docker 资产凭据、数据库账号密码、Git 仓库凭据。</li> <li><strong>加强审计</strong>：开启并定期检查用户操作日志、SSH 命令日志、构建与脚本执行记录，关注异常登录时间与来源。</li></ul> <h2 id="_8-是否可能已被利用-自查与处置建议"><a href="#_8-是否可能已被利用-自查与处置建议" class="header-anchor">#</a> 8. 是否可能已被利用：自查与处置建议</h2> <p>Jpom 无法远程判断您的实例是否已被攻击，请按下表自查：</p> <table><thead><tr><th>自查项</th> <th>检查位置</th> <th>需要关注的情况</th></tr></thead> <tbody><tr><td>管理员账号</td> <td>系统管理 → 用户管理</td> <td>出现未知管理员账号、账号权限被提升</td></tr> <tr><td>登录记录</td> <td>系统管理 → 用户操作日志</td> <td>异常来源 IP、非工作时间登录、失败登录激增</td></tr> <tr><td>工作空间与资产</td> <td>工作空间、SSH/FTP/Docker 资产</td> <td>出现未知工作空间、未知节点、未知 SSH/FTP/Docker 资产</td></tr> <tr><td>构建与仓库</td> <td>在线构建、仓库管理</td> <td>出现未知构建任务、未知仓库地址或 webhook</td></tr> <tr><td>脚本与定时任务</td> <td>在线脚本、节点脚本、Cron</td> <td>出现未知脚本、未知定时任务</td></tr> <tr><td>主机与网络</td> <td>主机侧进程、出站连接、安全告警</td> <td>未知进程、可疑外联、异常流量</td></tr> <tr><td>插件端</td> <td><code>data/agent_authorize.json</code>、Agent 日志</td> <td>授权文件异常、日志中有明文密码（旧版本问题）</td></tr></tbody></table> <p>若发现可疑迹象，建议：</p> <ol><li><strong>先隔离</strong>：断开公网访问或停止服务，保留日志与磁盘快照用于取证，不要直接删除现场。</li> <li><strong>升级到 2.11.13</strong>，并在干净环境完成排查后恢复业务。</li> <li><strong>轮换所有可能暴露的凭据</strong>：管理员与用户密码、<code>jpom.user.token-jwt-key</code>、插件端授权密码、OpenAPI token、SSH/FTP 资产凭据、数据库账号、Git 仓库凭据；其他复用同一凭据的系统也一并轮换。</li> <li><strong>复核并清理</strong>未知账号、权限组、定时任务、构建、脚本、webhook、资产与节点。</li> <li>评估数据与内网的影响，必要时重装系统并从可信备份恢复；按贵司安全流程上报。</li></ol> <h2 id="_9-披露与发布时间线"><a href="#_9-披露与发布时间线" class="header-anchor">#</a> 9. 披露与发布时间线</h2> <table><thead><tr><th>时间</th> <th>事件</th></tr></thead> <tbody><tr><td>2026-02-05</td> <td>发布暂停维护公告（停止常规功能迭代）</td></tr> <tr><td>2026-09-15</td> <td>CVE-2026-91993 披露</td></tr> <tr><td>2026-10-16</td> <td>CVE-2026-111605 披露</td></tr> <tr><td>2026-10-31</td> <td>CVE-2026-120201 披露</td></tr> <tr><td>2026-11-02</td> <td>完成安全问题的修复、测试与验证（开发分支）</td></tr> <tr><td>2026-11-07</td> <td>发布 2.11.13 安全修复版（Server / Agent），明确安全维护继续；同步发布 Gitee / GitHub Release、Docker 镜像、下载中心与文档站更新</td></tr> <tr><td>2026-11-07</td> <td>发布本安全公告，作为官方统一说明入口</td></tr></tbody></table> <h2 id="_10-致谢"><a href="#_10-致谢" class="header-anchor">#</a> 10. 致谢</h2> <p>感谢通过 GitHub issue 等渠道报告安全问题的安全研究者与用户（包括 @Torchbearer127、@hieuPenguinnn 等），也感谢参与版本验证与反馈的社区用户。安全问题的及时报告对 Jpom 用户非常重要。</p> <h2 id="_11-参考链接"><a href="#_11-参考链接" class="header-anchor">#</a> 11. 参考链接</h2> <ul><li><a href="https://gitee.com/dromara/Jpom/releases/tag/v2.11.13" target="_blank" rel="noopener noreferrer">Gitee Release v2.11.13<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/dromara/Jpom/releases/tag/v2.11.13" target="_blank" rel="noopener noreferrer">GitHub Release v2.11.13<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="/pages/all-downloads/">下载中心（稳定版）</a></li> <li><a href="/pages/FQA/upgrade/">升级版本说明</a></li> <li><a href="/pages/changelog/new/">2.11.13 更新日志</a></li> <li><a href="/pages/security/" class="router-link-active">全部安全公告</a></li> <li>安全报告与联系：bwcx_jzy@dromara.org（请勿在公开 issue 中披露未修复漏洞细节或凭据）</li></ul> <h2 id="_12-常见问题-faq"><a href="#_12-常见问题-faq" class="header-anchor">#</a> 12. 常见问题（FAQ）</h2> <h3 id="旧版本还能在线升级到-2-11-13-吗"><a href="#旧版本还能在线升级到-2-11-13-吗" class="header-anchor">#</a> 旧版本还能在线升级到 2.11.13 吗？</h3> <p>可以。登录后进入 <strong>系统管理 → 在线升级</strong> 检查更新即可；若旧版本因网络或自身问题检测不到，请从下载中心手动下载 <code>2.11.13</code> 升级。</p> <h3 id="只升级服务端、不升级插件端可以吗"><a href="#只升级服务端、不升级插件端可以吗" class="header-anchor">#</a> 只升级服务端、不升级插件端可以吗？</h3> <p>建议<strong>服务端与插件端都升级到 2.11.13</strong>。本次修复以服务端为主，但插件端也有安全加固（授权密码不再写日志等），且版本不一致可能引入兼容问题。</p> <h3 id="docker-的-latest-现在是安全版本吗"><a href="#docker-的-latest-现在是安全版本吗" class="header-anchor">#</a> Docker 的 <code>latest</code> 现在是安全版本吗？</h3> <p>是。自 2026-11-07 起 <code>jpomdocker/jpom:latest</code> 与 <code>jpomdocker/jpom-agent:latest</code> 指向 <code>2.11.13</code>。已经运行旧容器的用户需要重新拉取镜像并重新创建容器，仅重启旧容器不会升级。</p> <h3 id="升级后为什么需要重新登录"><a href="#升级后为什么需要重新登录" class="header-anchor">#</a> 升级后为什么需要重新登录？</h3> <p>未显式配置 <code>jpom.user.token-jwt-key</code> 的实例，升级后会自动生成随机 JWT 密钥，旧 token 失效。这是安全加固，不是故障；集群环境请为所有节点配置相同的 key。</p> <h3 id="升级后反向代理环境的-ip-白名单-登录锁定看起来不正常"><a href="#升级后反向代理环境的-ip-白名单-登录锁定看起来不正常" class="header-anchor">#</a> 升级后反向代理环境的 IP 白名单/登录锁定看起来不正常？</h3> <p>请确认已在 <code>jpom.web.trusted-proxies</code> 中配置反向代理地址，否则系统只能看到代理 IP。详见第 6 节。</p> <h3 id="项目是不是已经停止维护了"><a href="#项目是不是已经停止维护了" class="header-anchor">#</a> 项目是不是已经停止维护了？</h3> <p>Jpom 自 2026-02-05 起暂停的是<strong>常规功能迭代</strong>（见<a href="/pages/project-suspended/">项目暂停维护公告</a>）；本次 <strong>2.11.13 安全修复版已发布</strong>，<strong>安全维护仍在继续</strong>，后续安全问题请关注本安全公告；也欢迎社区继续提交 PR。</p> <h3 id="继续使用旧版本可以吗"><a href="#继续使用旧版本可以吗" class="header-anchor">#</a> 继续使用旧版本可以吗？</h3> <p>不建议。<code>2.11.12</code> 及更早版本存在本公告所述的严重安全问题，且不会再获得修复；如确实无法立即升级，请至少完成第 7 节的临时缓解并尽快升级。</p></div></div> <div class="page-slot page-slot-bottom">
