  </div> <div class="theme-vdoing-content content__default"><h1 id="go-插件端安装与部署"><a href="#go-插件端安装与部署" class="header-anchor">#</a> Go 插件端安装与部署</h1> <blockquote><p>适用版本：Go 插件端随对应 Jpom 版本发布（与 Java 插件端同版本号），作为<strong>可选的插件端安装方式</strong>；它与 Java 插件端兼容同一份配置、同一份数据与同一套协议，可随时回切 Java 插件端。
若你的版本下载页没有 Go 插件端包，请继续使用 Java 插件端，或参考「Java 与 Go 平滑切换」评估后再升级版本。
适用场景：希望使用<strong>单二进制、无 JDK 依赖、低内存</strong>的插件端，或计划从 Java 插件端切换到 Go 插件端。
前置条件：一台能访问 Jpom 服务端的 Linux / Windows / macOS 主机；端口默认 2123（可配置）。</p></blockquote> <h2 id="_1-认识-go-插件端"><a href="#_1-认识-go-插件端" class="header-anchor">#</a> 1. 认识 Go 插件端</h2> <p>Jpom 插件端（Agent）负责在目标机器上执行项目启停、脚本、文件管理、监控等任务。Go 插件端是用 Go 重写的实现，与 Java 插件端<strong>协议、配置、数据完全兼容</strong>：</p> <table><thead><tr><th>项</th> <th>说明</th></tr></thead> <tbody><tr><td>运行形态</td> <td>单个静态二进制（bin/agent），不需要安装 JDK/JRE</td></tr> <tr><td>配置文件</td> <td>与 Java 插件端<strong>同一份</strong> conf/application.yml（键名、默认值一致）</td></tr> <tr><td>数据目录</td> <td>与 Java 插件端<strong>同一个</strong> data/ 目录（project.json、script.json、agent_authorize.json 等 schema 一致）</td></tr> <tr><td>通信协议</td> <td>与 Java 插件端完全一致（HTTP + WebSocket，端口默认 2123，Jpom-Agent-Authorize 鉴权）</td></tr> <tr><td>与 Java 版关系</td> <td>可在同一目录共存、随时切换/回切，数据无需迁移（见「Java 与 Go 平滑切换」）</td></tr></tbody></table> <div class="custom-block tip"><p class="custom-block-title">运行 Java 项目仍需要 JDK</p> <p>Go 插件端自身不需要 JDK，但要启动 <strong>Java 项目</strong>（java -jar / classpath 等）时，目标机器仍需安装 JDK 并让插件端进程能找到 java 命令（参考本文「6. 配置 JAVA_HOME/PATH」）。</p></div> <h2 id="_2-下载与校验"><a href="#_2-下载与校验" class="header-anchor">#</a> 2. 下载与校验</h2> <ol><li>打开 Jpom 下载中心（文档站「日志&amp;下载」→ 下载中心），进入对应版本目录；</li> <li>下载与目标平台匹配的 Go 插件端安装包：</li></ol> <div class="language-text line-numbers-mode"><pre class="language-text"><code>agent-go-&amp;lt;version&gt;-release-linux-amd64.zip
agent-go-&amp;lt;version&gt;-release-linux-arm64.zip
agent-go-&amp;lt;version&gt;-release-windows-amd64.zip
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><ol start="3"><li>下载同目录的 <code>.sha1</code> 校验文件并校验（防止下载损坏/被篡改）：</li></ol> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># Linux / macOS</span>
sha1sum agent-go-<span class="token operator">&lt;</span>version<span class="token operator">&gt;</span>-release-linux-amd64.zip
<span class="token function">cat</span> agent-go-<span class="token operator">&lt;</span>version<span class="token operator">&gt;</span>-release-linux-amd64.zip.sha1

<span class="token comment"># Windows PowerShell</span>
Get-FileHash .<span class="token punctuation">\</span>agent-go-<span class="token operator">&lt;</span>version<span class="token operator">&gt;</span>-release-windows-amd64.zip <span class="token parameter variable">-Algorithm</span> SHA1
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h2 id="_3-解压与目录布局"><a href="#_3-解压与目录布局" class="header-anchor">#</a> 3. 解压与目录布局</h2> <p>把安装包解压到你要安装的目录（下文以 <code>/opt/jpom/agent</code> 为例）：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">mkdir</span> <span class="token parameter variable">-p</span> /opt/jpom/agent
<span class="token function">sudo</span> <span class="token function">unzip</span> agent-go-<span class="token operator">&lt;</span>version<span class="token operator">&gt;</span>-release-linux-amd64.zip <span class="token parameter variable">-d</span> /opt/jpom/agent
<span class="token comment"># 若 zip 内还有一层目录，把内容移动到 /opt/jpom/agent 下即可</span>
<span class="token function">sudo</span> <span class="token function">chmod</span> +x /opt/jpom/agent/bin/agent /opt/jpom/agent/bin/AgentGo.sh
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>解压后的目录结构（与 Java 插件端保持一致）：</p> <div class="language-text line-numbers-mode"><pre class="language-text"><code>/opt/jpom/agent/
├── bin/
│   ├── agent               # Go 插件端可执行文件
│   ├── AgentGo.sh          # 服务脚本（start|stop|restart|status|upgrade）
│   └── agent.pid           # 运行时生成
├── conf/
│   └── application.yml     # 配置文件（与 Java 插件端同一份）
├── data/                   # 数据目录（自动初始化）
├── logs/                   # 运行日志（stdout.log）
├── project-log/            # 项目控制台日志（未自定义路径时）
└── tmp/                    # 临时目录
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><h2 id="_4-启动、停止与状态"><a href="#_4-启动、停止与状态" class="header-anchor">#</a> 4. 启动、停止与状态</h2> <p>使用包内自带的服务脚本（与 Java 插件端的 Agent.sh 用法一致）：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> /opt/jpom/agent

<span class="token comment"># 启动（后台运行，日志输出到 logs/stdout.log）</span>
bin/AgentGo.sh start

<span class="token comment"># 查看状态（运行中会输出 pid）</span>
bin/AgentGo.sh status

<span class="token comment"># 重启</span>
bin/AgentGo.sh restart

<span class="token comment"># 停止</span>
bin/AgentGo.sh stop
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>首次启动会自动生成：</p> <table><thead><tr><th>文件</th> <th>说明</th></tr></thead> <tbody><tr><td>data/INSTALL.json</td> <td>本机安装 ID（<strong>请勿删除</strong>，删除后与 Server 的节点/机器绑定会失效）</td></tr> <tr><td>data/agent_authorize.json</td> <td>当 conf 中未配置 <code>agent-pwd</code> 时自动生成的鉴权账号（权限 600，<strong>请勿泄露</strong>）</td></tr></tbody></table> <div class="custom-block warning"><p class="custom-block-title">同一目录不要同时运行两个插件端</p> <p>Java 插件端与 Go 插件端<strong>不能同时</strong>运行并写同一个 data/ 目录（会互相覆盖数据）。切换时必须先停旧进程，再启动另一个（详见「Java 与 Go 平滑切换」）。</p></div> <h2 id="_5-注册为系统服务-推荐"><a href="#_5-注册为系统服务-推荐" class="header-anchor">#</a> 5. 注册为系统服务（推荐）</h2> <h3 id="_5-1-linux-systemd"><a href="#_5-1-linux-systemd" class="header-anchor">#</a> 5.1 Linux（systemd）</h3> <div class="language-ini line-numbers-mode"><pre class="language-ini"><code><span class="token comment"># /etc/systemd/system/jpom-agent.service</span>
<span class="token section"><span class="token punctuation">[</span><span class="token section-name selector">Unit</span><span class="token punctuation">]</span></span>
<span class="token key attr-name">Description</span><span class="token punctuation">=</span><span class="token value attr-value">Jpom Agent</span>
<span class="token key attr-name">After</span><span class="token punctuation">=</span><span class="token value attr-value">network.target</span>

<span class="token section"><span class="token punctuation">[</span><span class="token section-name selector">Service</span><span class="token punctuation">]</span></span>
<span class="token key attr-name">Type</span><span class="token punctuation">=</span><span class="token value attr-value">simple</span>
<span class="token key attr-name">User</span><span class="token punctuation">=</span><span class="token value attr-value">jpom</span>
<span class="token key attr-name">WorkingDirectory</span><span class="token punctuation">=</span><span class="token value attr-value">/opt/jpom/agent</span>
<span class="token comment"># 运行 Java 项目需要 java 命令：按实际 JDK 路径设置</span>
<span class="token key attr-name">Environment</span><span class="token punctuation">=</span><span class="token value attr-value">JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64</span>
<span class="token key attr-name">Environment</span><span class="token punctuation">=</span><span class="token value attr-value">PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin</span>
<span class="token key attr-name">ExecStart</span><span class="token punctuation">=</span><span class="token value attr-value">/opt/jpom/agent/bin/agent -base /opt/jpom/agent</span>
<span class="token key attr-name">Restart</span><span class="token punctuation">=</span><span class="token value attr-value">on-failure</span>
<span class="token key attr-name">RestartSec</span><span class="token punctuation">=</span><span class="token value attr-value">5</span>

<span class="token section"><span class="token punctuation">[</span><span class="token section-name selector">Install</span><span class="token punctuation">]</span></span>
<span class="token key attr-name">WantedBy</span><span class="token punctuation">=</span><span class="token value attr-value">multi-user.target</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> systemctl daemon-reload
<span class="token function">sudo</span> systemctl <span class="token builtin class-name">enable</span> <span class="token parameter variable">--now</span> jpom-agent
<span class="token function">sudo</span> systemctl status jpom-agent
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="custom-block tip"><p class="custom-block-title">用 systemd 托管时的升级</p> <p>使用 systemd 托管后，Go 插件端自升级（在线升级）会重启进程；若希望升级后由 systemd 拉起，可设置 <code>Restart=always</code>。也可以继续用 <code>bin/AgentGo.sh</code> 手工启停（二选一，不要重复拉起同一个实例）。</p></div> <h3 id="_5-2-windows"><a href="#_5-2-windows" class="header-anchor">#</a> 5.2 Windows</h3> <p>安装包内提供 <code>bin\AgentGo.bat</code>（与 Linux 的 AgentGo.sh 用法一致）：</p> <div class="language-bat line-numbers-mode"><pre class="language-text"><code>cd C:\jpom\agent

REM 启动（后台运行，输出写入 logs\stdout.log）
bin\AgentGo.bat start

REM 查看状态 / 重启 / 停止
bin\AgentGo.bat status
bin\AgentGo.bat restart
bin\AgentGo.bat stop
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>注册为 Windows 服务（任选一种，注意<strong>只保留一种托管方式</strong>，不要同时用服务 + 手工启动重复拉起）：</p> <p><strong>方式 A：nssm（推荐，简单稳定）</strong></p> <div class="language-bat line-numbers-mode"><pre class="language-text"><code>REM 下载 nssm 后执行（路径按实际修改）
nssm install JpomAgent &quot;C:\jpom\agent\bin\agent.exe&quot; &quot;-base&quot; &quot;C:\jpom\agent&quot;
nssm set JpomAgent AppDirectory &quot;C:\jpom\agent&quot;
nssm set JpomAgent AppStdout &quot;C:\jpom\agent\logs\stdout.log&quot;
nssm set JpomAgent AppStderr &quot;C:\jpom\agent\logs\stdout.log&quot;
nssm set JpomAgent AppExit Default Restart
nssm start JpomAgent
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p><strong>方式 B：Windows 自带 sc</strong></p> <div class="language-bat line-numbers-mode"><pre class="language-text"><code>sc create JpomAgent binPath= &quot;C:\jpom\agent\bin\agent.exe -base C:\jpom\agent&quot; start= auto
sc description JpomAgent &quot;Jpom Agent&quot;
sc start JpomAgent
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><blockquote><p>用 <code>sc</code> 注册时，<code>binPath=</code> 的引号与空格处理较严格；如启动失败优先改用 nssm。</p></blockquote> <p><strong>方式 C：计划任务（无服务权限时）</strong></p> <div class="language-bat line-numbers-mode"><pre class="language-text"><code>schtasks /create /tn &quot;JpomAgent&quot; /tr &quot;C:\jpom\agent\bin\agent.exe -base C:\jpom\agent&quot; /sc onstart /ru SYSTEM /rl HIGHEST
schtasks /run /tn &quot;JpomAgent&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><div class="custom-block warning"><p class="custom-block-title">Windows 下运行 Java 项目需要 JAVA_HOME/PATH</p> <p>无论是手工启动还是注册为服务，都要保证<strong>插件端进程</strong>能找到 <code>java.exe</code>：在「系统属性 -&gt; 环境变量」中配置 <code>JAVA_HOME</code>，并把 <code>%JAVA_HOME%\bin</code> 加入 <code>PATH</code>；用 nssm/sc 注册后需重启服务使环境变量生效。验证：用插件端运行用户执行 <code>java -version</code> 能输出版本。</p></div> <h2 id="_6-配置-java-home-path-运行-java-项目必需"><a href="#_6-配置-java-home-path-运行-java-项目必需" class="header-anchor">#</a> 6. 配置 JAVA_HOME/PATH（运行 Java 项目必需）</h2> <p>Go 插件端自身不依赖 JDK，但它执行的项目命令依赖系统里的 java。请确保<strong>插件端进程</strong>的环境变量包含 java：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 验证：以插件端运行用户执行</span>
<span class="token function">java</span> <span class="token parameter variable">-version</span>
<span class="token function">which</span> <span class="token function">java</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><ul><li>用 <code>bin/AgentGo.sh</code> 手工启动：在启动前 <code>export JAVA_HOME=...</code>、<code>export PATH=$JAVA_HOME/bin:$PATH</code>（或写入 /etc/profile，并保证非登录 shell 也生效）；</li> <li>用 systemd：在 service 文件里写 <code>Environment=...</code>（见 5.1）；</li> <li>用 Windows 服务：在服务/系统环境变量中配置 <code>JAVA_HOME</code> 与 <code>PATH</code>。</li></ul> <h2 id="_7-接入-jpom-服务端"><a href="#_7-接入-jpom-服务端" class="header-anchor">#</a> 7. 接入 Jpom 服务端</h2> <ol><li>在 Server 的「资产管理 → 机器资产」中新增机器：
<ul><li>地址：插件端所在机器的 IP；</li> <li>端口：插件端 <code>server.port</code>（默认 2123）；</li> <li>账号/密码：即 conf 中 <code>jpom.authorize.agent-name</code> / <code>agent-pwd</code>；若密码未配置，可在插件端 <code>data/agent_authorize.json</code> 查看自动生成的账号密码（该文件仅本机可读，注意保密）。</li></ul></li> <li>在「节点管理」中把机器分配到工作空间，生成节点；</li> <li>回到节点列表确认节点在线（openStatus 正常），并逐一检查监控、项目、脚本、文件、日志等功能。</li></ol> <div class="custom-block tip"><p class="custom-block-title">验证插件端本身是否可用</p> <p>在插件端机器上执行 <code>curl http://127.0.0.1:2123/</code>，应返回一行文本：<code>Jpom-Agent,Can't access directly,Please configure it to JPOM server</code>；其它接口需要鉴权头，正常由 Server 调用，无需手工访问。</p></div> <h2 id="_8-卸载"><a href="#_8-卸载" class="header-anchor">#</a> 8. 卸载</h2> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>bin/AgentGo.sh stop
<span class="token comment"># 备份数据后再删除目录（data/ 含项目/脚本/授权信息）</span>
<span class="token function">tar</span> czf ~/jpom-agent-backup-<span class="token variable"><span class="token variable">$(</span><span class="token function">date</span> +%Y%m%d<span class="token variable">)</span></span>.tgz <span class="token parameter variable">-C</span> /opt/jpom/agent conf data
<span class="token function">sudo</span> <span class="token function">rm</span> <span class="token parameter variable">-rf</span> /opt/jpom/agent
<span class="token comment"># 如注册过 systemd：sudo systemctl disable --now jpom-agent &amp;&amp; sudo rm /etc/systemd/system/jpom-agent.service</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><div class="custom-block danger"><p class="custom-block-title">删除 data/ 前务必确认</p> <p>data/INSTALL.json 记录安装 ID，data/agent_authorize.json 记录鉴权凭据；直接删除会导致 Server 侧节点失联或需要重新绑定。</p></div> <h2 id="_9-下一步"><a href="#_9-下一步" class="header-anchor">#</a> 9. 下一步</h2> <ul><li>配置项说明：<a href="/pages/go-agent/config/">配置说明</a></li> <li>从 Java 插件端切换：<a href="/pages/go-agent/switch/">Java 与 Go 平滑切换</a></li> <li>升级：<a href="/pages/go-agent/upgrade/">在线升级</a></li> <li>问题排查：<a href="/pages/go-agent/faq/">常见问题</a></li></ul></div></div> <div class="page-slot page-slot-bottom">
