  </div> <div class="theme-vdoing-content content__default"><h1 id="go-插件端在线升级与回滚"><a href="#go-插件端在线升级与回滚" class="header-anchor">#</a> Go 插件端在线升级与回滚</h1> <blockquote><p>适用版本：提供 Go 插件端的 Jpom 版本。
要点：Go 插件端通过「升级容器包」完成在线升级 —— 对 Server 而言它仍是一个合法的 Agent 升级包，对 Go 插件端而言它是携带 Go 可执行文件的容器，解包后<strong>原地替换二进制并重启</strong>。</p></blockquote> <h2 id="_1-升级包说明"><a href="#_1-升级包说明" class="header-anchor">#</a> 1. 升级包说明</h2> <table><thead><tr><th>包</th> <th>用途</th> <th>说明</th></tr></thead> <tbody><tr><td><code>agent-go-&lt;version&gt;-upgrade-&lt;os&gt;-&lt;arch&gt;.jar</code></td> <td><strong>在线升级用</strong>（推荐）</td> <td>5 平台容器（linux-amd64、linux-arm64、darwin-amd64、darwin-arm64、windows-amd64）：内含 <code>go-agent/agent.json</code> 与对应平台的 <code>go-agent/bin/go-agent-&lt;os&gt;-&lt;arch&gt;</code>；对 Server 是合法 Agent 包，Go 插件端识别后自升级</td></tr> <tr><td><code>agent-go-&lt;version&gt;-upgrade.jar</code></td> <td>兼容别名</td> <td>等同 linux/amd64 容器副本，供旧版 Server <strong>手工上传</strong>、默认回退或不确定节点平台时使用（amd64 Linux 节点）</td></tr> <tr><td><code>agent-go-&lt;version&gt;-release-&lt;os&gt;-&lt;arch&gt;.zip</code></td> <td>全新安装 / 手工替换</td> <td>完整安装包（bin、conf、脚本等）；<strong>不是</strong>在线升级包（Server 的 Go 升级校验要求容器内含 <code>go-agent/agent.json</code>）</td></tr></tbody></table> <div class="custom-block danger"><p class="custom-block-title">平台必须完全匹配</p> <p>升级容器里的可执行文件是<strong>单一平台</strong>的。Go 插件端会校验容器 <code>agent.json.platform</code> 与当前进程的 <code>GOOS/GOARCH</code> <strong>完全一致</strong>，并校验容器内可执行文件与文件名平台一致；不一致会直接拒绝（提示“升级包平台不匹配”）且<strong>不会改动现有二进制</strong>。因此：</p> <ul><li>linux-amd64 节点用 <code>upgrade-linux-amd64.jar</code>，linux-arm64 用 <code>upgrade-linux-arm64.jar</code>，Windows 用 <code>upgrade-windows-amd64.jar</code>，macOS 用对应 darwin 容器；</li> <li>旧版 Server（不支持按平台自动选择）手工上传时也必须上传<strong>节点对应平台</strong>的容器；只有 linux-amd64 节点可以用兼容别名 <code>upgrade.jar</code>。</li></ul></div> <div class="custom-block warning"><p class="custom-block-title">Java 升级包不能用于 Go 插件端</p> <p>Java 插件端的 <code>Agent-&lt;version&gt;.jar</code> <strong>不能</strong>升级 Go 插件端（Go 插件端没有 JVM 无法执行 jar）。上传该类包时 Go 插件端会返回明确提示：不支持 Java 插件端升级包，请上传包含 <code>go-agent/agent.json</code> 与 Go 可执行文件的升级包。</p></div> <h2 id="_2-server-版本要求"><a href="#_2-server-版本要求" class="header-anchor">#</a> 2. Server 版本要求</h2> <table><thead><tr><th>Server 版本</th> <th>升级方式</th></tr></thead> <tbody><tr><td>已支持识别 Go 插件端（节点 engine=go、按节点平台选择升级包）的版本</td> <td>在「节点管理 → 在线升级」中直接选择/自动获取对应平台的 Go 升级容器（<code>agent-go-&lt;version&gt;-upgrade-&lt;os&gt;-&lt;arch&gt;.jar</code>）下发即可；Server 会按节点 <code>/info</code> 上报的平台匹配容器</td></tr> <tr><td>旧版 Server（低于上述起始版本）</td> <td>Server 不识别 Go 引擎，请把<strong>与节点平台匹配</strong>的 Go 升级容器<strong>当普通 Agent 升级包手工上传</strong>执行（容器的 MANIFEST 可通过旧 Server 的 jar 校验），或使用离线方式替换二进制</td></tr></tbody></table> <div class="custom-block tip"><p class="custom-block-title">起始版本</p> <p>Go 插件端的起始支持版本以对应 Jpom 版本的更新日志/下载页为准（与 Java 插件端同版本号发布）。升级前建议先在测试节点验证。</p></div> <h2 id="_3-升级前置检查"><a href="#_3-升级前置检查" class="header-anchor">#</a> 3. 升级前置检查</h2> <ul><li>[ ] 插件端由 <code>bin/AgentGo.sh</code>（Linux/macOS）、<code>bin\AgentGo.bat</code>（Windows）或系统服务托管运行中；若用 systemd/nssm，确认退出后会自动拉起（见第 8 节服务管理注意事项）；</li> <li>[ ] 下载升级包并校验 sha1；</li> <li>[ ] 确认升级包平台与节点一致（<code>linux-amd64</code> / <code>linux-arm64</code> / <code>darwin-amd64</code> / <code>darwin-arm64</code> / <code>windows-amd64</code>）；</li> <li>[ ] 磁盘空间充足（升级会临时占用约 2 倍安装包大小）；</li> <li>[ ] 记录当前版本（Server 节点信息，或插件端 <code>bin/agent -version</code>）；</li> <li>[ ] 如需支持回滚旧版本，确认 <code>jpom.system.allowed-downgrade</code> 的配置符合预期（默认不允许降级）。</li></ul> <h2 id="_4-通过-server-在线升级-推荐"><a href="#_4-通过-server-在线升级-推荐" class="header-anchor">#</a> 4. 通过 Server 在线升级（推荐）</h2> <ol><li>打开 Server「节点管理 → 在线升级」；</li> <li>选择/上传<strong>与节点平台匹配</strong>的 Go 升级包：新版 Server 会自动按节点平台选择 <code>agent-go-&lt;version&gt;-upgrade-&lt;os&gt;-&lt;arch&gt;.jar</code>；
旧版 Server 手工上传时，linux-amd64 节点可用兼容别名 <code>agent-go-&lt;version&gt;-upgrade.jar</code>，其它平台必须上传对应平台容器；</li> <li>选择需要升级的一个或多个节点（可只选 Go 插件端节点）；</li> <li>执行升级，观察进度与结果：
<ul><li>Server 会按分片把升级包传到插件端；</li> <li>插件端校验后替换二进制，并在约 2 秒后重启；</li> <li>Server 在约 10 秒后开始探测节点状态（每秒一次，最多约 2 分钟）；</li> <li>成功后会刷新显示新版本。</li></ul></li> <li>升级完成后在节点监控、项目、脚本页面抽查一遍。</li></ol> <div class="custom-block tip"><p class="custom-block-title">升级期间项目会中断吗</p> <p>升级只重启<strong>插件端进程</strong>，不会主动停止由插件端启动的业务项目进程（前提是项目按标准方式独立启动）。但升级瞬间正在执行的控制台操作（启动/停止/日志推流）会中断，建议避开业务高峰期。</p></div> <h2 id="_5-升级包校验规则-失败时的返回"><a href="#_5-升级包校验规则-失败时的返回" class="header-anchor">#</a> 5. 升级包校验规则（失败时的返回）</h2> <p>插件端在安装前会做以下校验，任一不通过则<strong>不替换二进制</strong>并返回提示：</p> <table><thead><tr><th>校验</th> <th>不通过时的提示</th></tr></thead> <tbody><tr><td>包格式/可解压</td> <td>此文件不是 jpom 安装包</td></tr> <tr><td>平台匹配</td> <td>升级包平台不匹配：<platform></platform></td></tr> <tr><td>最低兼容版本</td> <td>当前程序版本 X 新版程序最低兼容 Y 不能直接升级</td></tr> <tr><td>与当前版本相同</td> <td>新包和正在运行的包一致</td></tr> <tr><td>版本降级（未允许）</td> <td>在线升级不能降级操作</td></tr> <tr><td>可执行文件完整性</td> <td>升级包校验失败，可执行文件 sha256 不一致</td></tr> <tr><td>Java 升级包</td> <td>Go 插件端不支持 Java 插件端升级包…</td></tr></tbody></table> <h2 id="_6-升级过程做了什么-便于排查"><a href="#_6-升级过程做了什么-便于排查" class="header-anchor">#</a> 6. 升级过程做了什么（便于排查）</h2> <ol><li>备份当前可执行文件到 <code>bin/oldJars/</code>（文件名含版本与时间戳）；</li> <li>把新可执行文件写入临时文件（<code>bin/agent.upgrade</code>）并设置可执行权限，再原子替换 <code>bin/agent</code>；</li> <li>更新 <code>bin/upgrade.json</code>（记录 beforeJar/newJar/updateTime/upgradeCount）与 <code>bin/run.bin</code>（当前运行的可执行文件名）；</li> <li>按 <code>jpom.system.old-jars-count</code> 清理过旧的备份；</li> <li>约 2 秒后重启进程（用 <code>bin/AgentGo.sh</code> 托管时由脚本/服务管理器拉起）。</li></ol> <h2 id="_7-回滚到上一个版本"><a href="#_7-回滚到上一个版本" class="header-anchor">#</a> 7. 回滚到上一个版本</h2> <h3 id="_7-1-手工回滚-推荐-最直接"><a href="#_7-1-手工回滚-推荐-最直接" class="header-anchor">#</a> 7.1 手工回滚（推荐，最直接）</h3> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> /opt/jpom/agent
bin/AgentGo.sh stop
<span class="token function">ls</span> <span class="token parameter variable">-lt</span> bin/oldJars/            <span class="token comment"># 找到上一个版本备份（文件名含版本与时间）</span>
<span class="token function">cp</span> bin/oldJars/<span class="token operator">&lt;</span>备份文件名<span class="token operator">&gt;</span> bin/agent
<span class="token function">chmod</span> +x bin/agent
bin/AgentGo.sh start
bin/AgentGo.sh status
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>回滚后确认节点在线、版本显示为旧版本即可。</p> <h3 id="_7-2-通过升级包降级"><a href="#_7-2-通过升级包降级" class="header-anchor">#</a> 7.2 通过升级包降级</h3> <p>若确认允许降级（<code>jpom.system.allowed-downgrade: true</code> 并重启插件端），可以把旧版本的 Go 升级包重新上传一次，走第 4 节流程完成降级。</p> <div class="custom-block danger"><p class="custom-block-title">默认不允许降级</p> <p><code>allowed-downgrade</code> 默认为 <code>false</code>，此时上传更低版本的升级包会被拒绝（在线升级不能降级操作），请用 6.1 手工回滚。</p></div> <h2 id="_8-升级失败排查"><a href="#_8-升级失败排查" class="header-anchor">#</a> 8. 升级失败排查</h2> <table><thead><tr><th>现象</th> <th>排查方向</th></tr></thead> <tbody><tr><td>上传后提示“新包和正在运行的包一致”</td> <td>上传的是同版本包；确认版本号与构建时间</td></tr> <tr><td>提示“升级包平台不匹配”</td> <td>下载了其它平台/架构的容器（如 arm64 节点上传了 linux-amd64 容器）；改用节点对应平台的 <code>agent-go-&lt;version&gt;-upgrade-&lt;os&gt;-&lt;arch&gt;.jar</code>；仅 linux-amd64 节点可用兼容别名 <code>upgrade.jar</code></td></tr> <tr><td>下载中心找不到对应平台</td> <td>在对应版本段落的“Go 插件端在线升级容器”列表中按平台选择；旧版本可能只提供 linux-amd64 兼容别名</td></tr> <tr><td>提示 sha256 不一致</td> <td>升级包损坏，重新下载并校验 sha1</td></tr> <tr><td>提示不支持 Java 插件端升级包</td> <td>误传了 <code>Agent-&lt;version&gt;.jar</code>，改传 Go 升级包</td></tr> <tr><td>升级后节点未恢复在线</td> <td>查看插件端 <code>logs/stdout.log</code>；确认二进制可执行（<code>ls -l bin/agent</code>）、端口与配置未变；必要时按 7.1 回滚</td></tr> <tr><td>systemd 托管下未自动重启</td> <td>service 文件需配置 <code>Restart=always</code>（或升级后手工 <code>systemctl start jpom-agent</code>）</td></tr> <tr><td>Docker/只读文件系统</td> <td>无法自升级（目录不可写）。<strong>官方未提供 Go 插件端 Docker 镜像</strong>（<code>jpomdocker/jpom-agent</code> 是 Java 插件端镜像）；自建镜像时把插件端目录挂载为可写卷才能用在线升级，否则请替换镜像/二进制</td></tr> <tr><td>systemd/nssm 托管下升级后出现双实例或反复重启</td> <td>只保留一种托管方式（不要同时用服务 + 手工启动）；systemd 配 <code>Restart=always</code>、nssm 配 <code>AppExit Default Restart</code>；Go 插件端在服务管理器下会把重启交给服务管理器</td></tr></tbody></table> <div class="custom-block warning"><p class="custom-block-title">服务管理器托管时的升级（重要）</p> <ul><li><strong>Linux systemd</strong>：Go 插件端自升级会在原地重启进程（PID 不变），不会调用 <code>systemctl</code>；如希望异常退出后也能自动拉起，service 需配置 <code>Restart=always</code>（或至少 <code>on-failure</code>）。<strong>不要</strong>依赖 <code>JPOM_SERVICE</code> 环境变量——该变量仅 Java 插件端使用，Go 插件端不读取。</li> <li><strong>Windows nssm / sc 服务</strong>：Go 插件端在服务管理器下升级时会把退出交给服务管理器重启，避免出现两个实例。nssm 请设置 <code>AppExit Default Restart</code>，并<strong>不要</strong>同时手工 <code>AgentGo.bat start</code>；<code>sc</code> 注册的服务建议配置失败恢复策略（<code>sc failure</code>）。升级前先 <code>bin\AgentGo.bat status</code> 确认只有一个实例。</li> <li><strong>macOS launchd</strong>：配置 <code>KeepAlive</code> 让升级后自动拉起；手工运行时由 <code>bin/AgentGo.sh</code> 负责重启。</li></ul></div> <h2 id="_9-关于远程升级-检查新版本"><a href="#_9-关于远程升级-检查新版本" class="header-anchor">#</a> 9. 关于远程升级（检查新版本）</h2> <p>插件端提供「检查远程版本」与「远程升级」能力（与 Java 插件端同一套 Server 接口）。是否可用取决于：</p> <ol><li>Server/版本发布渠道是否提供 Go 插件端升级包；</li> <li>节点能访问下载地址；</li> <li>当前版本是否允许升级（同版本/降级/最低兼容版本规则同上）。</li></ol> <p>若下载中心暂未提供 Go 升级包，请使用第 4 节「上传升级包」的方式。</p> <h2 id="_10-相关文档"><a href="#_10-相关文档" class="header-anchor">#</a> 10. 相关文档</h2> <ul><li><a href="/pages/go-agent/install/">安装与部署</a></li> <li><a href="/pages/go-agent/config/">配置说明</a></li> <li><a href="/pages/go-agent/switch/">Java 与 Go 平滑切换</a></li> <li><a href="/pages/go-agent/faq/">常见问题</a></li></ul></div></div> <div class="page-slot page-slot-bottom">
