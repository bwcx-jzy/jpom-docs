  </div> <div class="theme-vdoing-content content__default"><h1 id="go-插件端配置说明"><a href="#go-插件端配置说明" class="header-anchor">#</a> Go 插件端配置说明</h1> <blockquote><p>适用版本：提供 Go 插件端的 Jpom 版本。
核心原则：Go 插件端与 Java 插件端使用<strong>同一份</strong> <code>conf/application.yml</code> 和<strong>同一个</strong> <code>data/</code> 目录，切换时<strong>不需要改配置、不需要迁移数据</strong>。</p></blockquote> <h2 id="_1-配置文件位置与加载"><a href="#_1-配置文件位置与加载" class="header-anchor">#</a> 1. 配置文件位置与加载</h2> <table><thead><tr><th>项</th> <th>说明</th></tr></thead> <tbody><tr><td>默认路径</td> <td><code>&lt;安装目录&gt;/conf/application.yml</code></td></tr> <tr><td>自定义路径</td> <td>启动参数 <code>-conf &lt;file&gt;</code>（等价 Java 的 <code>-Dspring.config.location</code>）</td></tr> <tr><td>安装根目录</td> <td>默认由可执行文件位置推断（<code>&lt;安装目录&gt;/bin/agent</code> → <code>&lt;安装目录&gt;</code>）；也可用 <code>-base &lt;dir&gt;</code> 指定，或配置 <code>jpom.path</code></td></tr> <tr><td>生效方式</td> <td>修改后重启插件端生效（Server 上「系统管理 → 插件端配置」在线保存等价于直接改该文件）</td></tr></tbody></table> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 查看当前生效的配置（只读）</span>
<span class="token function">cat</span> /opt/jpom/agent/conf/application.yml
<span class="token comment"># 指定配置文件与安装目录启动（一般由服务脚本/服务托管，不需要手工带参数）</span>
/opt/jpom/agent/bin/agent <span class="token parameter variable">-base</span> /opt/jpom/agent <span class="token parameter variable">-conf</span> /opt/jpom/agent/conf/application.yml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><div class="custom-block tip"><p class="custom-block-title">从 Java 插件端迁移</p> <p>直接用 Java 插件端的 <code>conf/application.yml</code> 即可，无需删改键；Go 插件端只读取自己用到的键，其余键忽略。</p></div> <h2 id="_2-常用配置项"><a href="#_2-常用配置项" class="header-anchor">#</a> 2. 常用配置项</h2> <p>以下键与 Java 插件端语义一致（完整键见 Java 插件端默认配置文件）：</p> <table><thead><tr><th>配置项</th> <th>默认值</th> <th>说明</th></tr></thead> <tbody><tr><td><code>server.port</code></td> <td>2123</td> <td>插件端监听端口；多实例/并行验证时改为其它端口（如 2124）</td></tr> <tr><td><code>server.address</code></td> <td>空（0.0.0.0）</td> <td>绑定地址</td></tr> <tr><td><code>jpom.path</code></td> <td>空</td> <td>数据根目录；为空时使用安装目录</td></tr> <tr><td><code>jpom.authorize.agent-name</code></td> <td>jpomAgent</td> <td>鉴权账号，<strong>必填</strong></td></tr> <tr><td><code>jpom.authorize.agent-pwd</code></td> <td>空</td> <td>鉴权密码；为空时自动生成并保存到 <code>data/agent_authorize.json</code></td></tr> <tr><td><code>jpom.init-read-line</code></td> <td>10</td> <td>查看日志时首次回放的行数</td></tr> <tr><td><code>jpom.system.lang</code></td> <td>空</td> <td>默认语言（zh-CN / en-US 等）；空则跟随请求语言/系统</td></tr> <tr><td><code>jpom.system.log-charset</code></td> <td>UTF-8</td> <td>插件端系统日志读取编码（系统日志页面/WS 日志）</td></tr> <tr><td><code>jpom.system.console-charset</code></td> <td>空</td> <td>脚本与命令输出编码；Windows 建议 GBK</td></tr> <tr><td><code>jpom.system.old-jars-count</code></td> <td>2</td> <td>升级备份保留个数（<code>bin/oldJars</code>）</td></tr> <tr><td><code>jpom.system.allowed-downgrade</code></td> <td>false</td> <td>是否允许在线升级降级（回滚旧版本时需要）</td></tr> <tr><td><code>jpom.system.command-use-sudo</code></td> <td>false</td> <td>执行系统命令是否自动加 sudo（需免密）</td></tr> <tr><td><code>jpom.system.timer-match-second</code></td> <td>false</td> <td>定时任务是否支持秒级（6/7 段 cron）</td></tr> <tr><td><code>jpom.project.status-wait-time</code></td> <td>10</td> <td>项目启停等待秒数</td></tr> <tr><td><code>jpom.project.status-detection-interval</code></td> <td>500</td> <td>项目状态检测间隔（毫秒）</td></tr> <tr><td><code>jpom.project.file-backup-count</code></td> <td>0</td> <td>项目文件备份保留个数（大于 0 才开始备份）</td></tr> <tr><td><code>jpom.project.log.file-charset</code></td> <td>空（Windows=GBK）</td> <td>项目控制台日志读写编码</td></tr> <tr><td><code>jpom.project.log.save-days</code></td> <td>7</td> <td>控制台日志备份保留天数</td></tr> <tr><td><code>jpom.project.log.auto-backup-size</code></td> <td>50MB</td> <td>控制台日志超过该大小自动备份</td></tr> <tr><td><code>jpom.monitor.network.stat-contains-only-names</code></td> <td>空</td> <td>监控只统计的网卡（支持 <code>en*</code> 通配，逗号分隔）</td></tr> <tr><td><code>jpom.monitor.network.stat-exclude-names</code></td> <td>空</td> <td>监控排除的网卡（如 <code>lo*</code>）</td></tr> <tr><td><code>spring.servlet.multipart.max-file-size</code></td> <td>5MB</td> <td>单文件上传上限（分片上传的单片大小由 Server 决定，默认 1MB）</td></tr> <tr><td><code>spring.servlet.multipart.max-request-size</code></td> <td>20MB</td> <td>请求总大小上限</td></tr></tbody></table> <div class="custom-block tip"><p class="custom-block-title">三个日志/输出编码项的区别</p> <ul><li><code>jpom.system.log-charset</code>：插件端<strong>系统日志</strong>（「插件端日志」页面 / 系统日志 WebSocket）的读取编码，默认 UTF-8；</li> <li><code>jpom.system.console-charset</code>：脚本执行与系统命令<strong>输出</strong>的读取编码，Windows 建议 GBK；</li> <li><code>jpom.project.log.file-charset</code>：<strong>项目控制台日志</strong>读写的编码（Windows 默认 GBK，其它系统默认 UTF-8；项目级 <code>logCharset</code> 可覆盖）。</li></ul> <p>三者都应与实际输出编码一致，否则页面会出现乱码；修改后需重启插件端生效。</p></div> <h2 id="_3-数据目录布局"><a href="#_3-数据目录布局" class="header-anchor">#</a> 3. 数据目录布局</h2> <p>默认在安装目录下（若配置了 <code>jpom.path</code>，则相对该目录）：</p> <div class="language-text line-numbers-mode"><pre class="language-text"><code>&amp;lt;安装目录&gt;/
├── conf/application.yml
├── bin/agent、bin/AgentGo.sh
├── data/
│   ├── INSTALL.json            # 安装 ID（勿删）
│   ├── agent_authorize.json    # 自动生成的鉴权账号（勿泄露）
│   ├── project.json             # 项目数据
│   ├── script.json              # 脚本模板
│   ├── script_log.json          # 脚本执行记录（待同步）
│   ├── whitelistDirectory.json  # 授权目录/可编辑后缀
│   ├── workspace_env_var.json   # 工作空间环境变量
│   ├── global-script/           # 脚本库
│   ├── script/&amp;lt;脚本ID&gt;/log/     # 脚本执行日志
│   ├── project_file_backup/     # 项目文件备份
│   ├── script_run_cache/        # 脚本运行临时文件
│   ├── remote_version.json      # 远程版本缓存
│   └── temp/                    # 临时文件（分片上传等）
├── logs/                        # 插件端运行日志
├── project-log/&amp;lt;项目ID&gt;/         # 项目控制台日志（未自定义 logPath 时）
└── tmp/                          # 临时目录
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><div class="custom-block warning"><p class="custom-block-title">数据目录兼容</p> <p>以上文件与 Java 插件端<strong>完全一致</strong>，切换后 Server 端看到的项目、脚本、环境变量、授权目录不会丢失。切换前后可用仓库中的 <code>go-agent/script/verify-switch-data.sh</code> 做结构对比（见「Java 与 Go 平滑切换」）。</p></div> <h2 id="_4-鉴权说明"><a href="#_4-鉴权说明" class="header-anchor">#</a> 4. 鉴权说明</h2> <p>插件端与 Server 之间使用请求头 <code>Jpom-Agent-Authorize</code> 鉴权，值为：</p> <div class="language-text line-numbers-mode"><pre class="language-text"><code>sha1(agentName + &quot;@&quot; + agentPwd)   # 小写十六进制
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>在 Server 的「机器资产」中填写的账号/密码就是 <code>agentName</code> / <code>agentPwd</code>；</li> <li>密码为空时，插件端首次启动会生成随机密码并写入 <code>data/agent_authorize.json</code>（权限 600），可在该文件查看（<strong>不要在聊天/工单/截图中暴露</strong>）；</li> <li>修改了 <code>agent-name</code> 但沿用旧 <code>agent_authorize.json</code> 时插件端会启动失败（提示已有登录名与配置不一致），需先删除该文件或同步修改 Server 机器资产。</li></ul> <h2 id="_5-与-java-插件端的差异-用户可见"><a href="#_5-与-java-插件端的差异-用户可见" class="header-anchor">#</a> 5. 与 Java 插件端的差异（用户可见）</h2> <table><thead><tr><th>项</th> <th>Java 插件端</th> <th>Go 插件端</th></tr></thead> <tbody><tr><td>运行依赖</td> <td>需要 JDK 8+</td> <td>单个二进制，无需 JDK</td></tr> <tr><td>内存占用</td> <td>JVM 固定开销较大</td> <td>常驻内存显著更低</td></tr> <tr><td>启动脚本</td> <td>bin/Agent.sh</td> <td>bin/AgentGo.sh（建议保留 Agent.sh 以便回切）</td></tr> <tr><td>升级包</td> <td>Agent-<version>.jar</version></td> <td>agent-go-<version>-upgrade.jar（Go 升级容器包）</version></td></tr> <tr><td>监控中的 JDK 相关字段</td> <td>javaVersion/totalMemory/freeMemory 有值</td> <td>对应字段为空/0（页面仅展示，不影响功能）</td></tr> <tr><td>项目启动</td> <td>调用系统 java</td> <td>调用系统 java（<strong>需自行配置 JAVA_HOME/PATH</strong>）</td></tr></tbody></table> <div class="custom-block tip"><p class="custom-block-title">关于 pluginSize 等展示字段</p> <p>Go 插件端没有 Java 的插件机制，系统缓存/首页里的个别统计字段（如 pluginSize）与 Java 版可能不同，但不影响任何功能。</p></div> <h2 id="_6-环境变量-可选"><a href="#_6-环境变量-可选" class="header-anchor">#</a> 6. 环境变量（可选）</h2> <table><thead><tr><th>变量</th> <th>说明</th></tr></thead> <tbody><tr><td><code>JAVA_HOME</code> / <code>PATH</code></td> <td>运行 Java 项目必需，让插件端进程能执行 java</td></tr> <tr><td><code>JPOM_LOG</code></td> <td>指定日志目录（等价 Java 插件端）</td></tr> <tr><td><code>JPOM_LANG</code></td> <td>默认语言（等价 jpom.system.lang）</td></tr> <tr><td><code>JPOM_ENCRYPT_AES_KEY</code></td> <td>与服务端通信的 AES 传输/表单加密密钥（默认 <code>Djnn3runZBzdv9Nv</code>）；<strong>Go 插件端只读取环境变量</strong>，必须与服务端一致</td></tr> <tr><td><code>JPOM_SERVICE</code></td> <td><strong>Go 插件端不读取</strong>（该变量仅 Java 插件端使用，用于 <code>systemctl restart &lt;服务名&gt;</code>）；Go 插件端升级走原地重启/由服务管理器拉起，systemd 请配 <code>Restart=always</code></td></tr></tbody></table> <div class="custom-block warning"><p class="custom-block-title">AES key：Java 的 `-D` 参数在 Go 插件端无效</p> <p><code>JPOM_ENCRYPT_AES_KEY</code> 在 Java 插件端既可以用环境变量，也可以用 JVM 系统属性（启动参数 <code>-DJPOM_ENCRYPT_AES_KEY=...</code>，优先级更高）；<strong>Go 插件端不是 JVM，只读取环境变量</strong>。切换 Java/Go 或双端启用 AES 加密时，请改用环境变量（<code>export JPOM_ENCRYPT_AES_KEY=...</code>、systemd 的 <code>Environment=</code>、Windows 系统环境变量），并确保服务端与插件端一致，否则连接会失败。</p></div> <div class="custom-block tip"><p class="custom-block-title">升级/重启由谁拉起</p> <ul><li>Linux：Go 插件端自升级使用原地重启（<code>syscall.Exec</code>，PID 不变），不需要 <code>JPOM_SERVICE</code>；异常退出后是否自动拉起由 systemd 的 <code>Restart=</code> 决定。</li> <li>Windows：服务管理器（nssm/sc）托管时由服务管理器负责重启；手工运行时用 <code>bin\AgentGo.bat restart</code>。</li> <li>macOS：launchd 配置 <code>KeepAlive</code> 自动拉起；手工运行用 <code>bin/AgentGo.sh restart</code>。</li></ul></div> <h2 id="_7-修改配置的建议流程"><a href="#_7-修改配置的建议流程" class="header-anchor">#</a> 7. 修改配置的建议流程</h2> <ol><li>低风险项（如 <code>init-read-line</code>、监控网卡）：直接改 <code>conf/application.yml</code> → <code>bin/AgentGo.sh restart</code>；</li> <li>端口/鉴权相关：先改配置，再同步修改 Server 端机器资产，最后重启插件端；</li> <li>变更前先备份：</li></ol> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> czf ~/jpom-agent-conf-<span class="token variable"><span class="token variable">$(</span><span class="token function">date</span> +%Y%m%d-%H%M<span class="token variable">)</span></span>.tgz <span class="token parameter variable">-C</span> /opt/jpom/agent conf data
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><div class="custom-block danger"><p class="custom-block-title">不要同时编辑同一份数据目录</p> <p>插件端运行期间不要用其它程序（包括另一个版本的插件端）写同一份 <code>data/</code> 与 <code>conf/</code>。</p></div> <h2 id="_8-相关文档"><a href="#_8-相关文档" class="header-anchor">#</a> 8. 相关文档</h2> <ul><li><a href="/pages/go-agent/install/">安装与部署</a></li> <li><a href="/pages/go-agent/switch/">Java 与 Go 平滑切换</a></li> <li><a href="/pages/go-agent/upgrade/">在线升级</a></li> <li><a href="/pages/go-agent/faq/">常见问题</a></li></ul></div></div> <div class="page-slot page-slot-bottom">
