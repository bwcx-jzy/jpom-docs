225672>节点&amp;项目</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://gitee.com/bwcx-jzy" target="_blank" title="作者" class="beLink" data-v-06225672>bwcx_jzy</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2026-11-18</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAAXNSR0IArs4c6QAABH1JREFUSA3tVl1oHFUUPmdmd2ltklqbpJDiNnXFmgbFktho7YMPNiJSSZM0+CAYSkUELVhM6YuwIPpgoOKDqOBDC0XE2CQoNtQXBUFTTcCi+Wlh1V2TQExsUzcltd3M9Tt3ZjZzZ2fT+OJTL8yeM+eee757fmeJbq//KQL8X3DUSFOcfr7cRsRtxNQMWueeVzOkaITIGqQHNg5y8+jNW9ldM7A6nTpAjuolUikAwq7CE3WcM2RRDz+XGVgN3FptU/aUSlvq9Pa3iZ1+sgAqJyyAFqkipd9dqiwHF3P65YycLWc/6sqGrvoEoIp6DOFaX5h6+dnfjkWprwqsPk0dUGq5vySwDImC10KxFHgGL1SWoc92O3eVht09qdXNH11I2SsTsJYqMWzihqGMi+A+Garf3BAuuLI5oGlULyNfyB/HYNujwktOfRrMr5t77NmevqaUopx0grnKAyvVpmwUDB4x6FPXuGvYLTDwWsejwgtgkYKPqRJg8SV6xaiZ3ZTppGneS4yfH5/66fZSDHv+QZci/+h5c5UHtpy67JUqGppM0sh0Nc1dW6/N1W5Yoqat8/TU/VnadmdeW2PLLSyh0cvxBs3KbqTmwYPpxN4do/mzE8nEpvX/UMu2Wbp74zUAK5q6WkHns7V0eWkdPbPzd3rxkTGybadYySumVzhcaJFbs5UrEkQ/+CK8gF5dnh/6ciIZ73gwQ927L1IitoxKLXYP3SjYdOrHHfTZhRRlFyrorafPk20B3HPD1y2G3qKZME5Jcf3t/HUC13/8tSd++vqFveMUTwAUxSUFI1QekR1+bIze3D9MF2aq6cPvG72CgnldWCFqyRw3lwH8ZMerjTD9ElRO7Gv44wNpC90aASqGfVlz/Rx17srQ57/UU26hkhQqUB7dBR71WmzQhHUnblGmVOEw0jhbV1n9OlXUDCIRGaNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">反向连接隧道（插件端主动连接服务端）<!----></h1> <div class="page-slot page-slot-top">
  <div class="wwads-cn wwads-horizontal page-wwads" data-id="188" style="display: flex !important"></div>
  </div> <div class="theme-vdoing-content content__default"><h1 id="反向连接隧道-插件端主动连接服务端"><a href="#反向连接隧道-插件端主动连接服务端" class="header-anchor">#</a> 反向连接隧道（插件端主动连接服务端）</h1> <blockquote><p>适用版本：2.11.14.2-beta 及以上</p></blockquote> <p>默认情况下，Jpom 由<strong>服务端主动访问插件端</strong>（HTTP 2123 端口 + WebSocket）来管理节点，因此服务端必须能直连插件端。插件端在 NAT 后面、没有公网 IP、或者不允许对外开放端口时，就只能做端口映射或打通 VPN。</p> <p>反向连接隧道把方向反过来：<strong>插件端主动拨号连接服务端</strong>，服务端不再需要能访问插件端的任何端口。插件端只要<strong>能出站访问服务端</strong>即可工作。</p> <h2 id="一、工作方式"><a href="#一、工作方式" class="header-anchor">#</a> 一、工作方式</h2> <ul><li>服务端只暴露一个 WebSocket 入口 <code>/agent/tunnel</code>；</li> <li>插件端启动后主动连接该入口，用<strong>连接密钥 + 节点标识</strong>完成握手，之后定期心跳表示在线；</li> <li>服务端需要调用插件端时（节点状态、项目管理、构建、文件、控制台、日志、在线升级等），通过这条连接下发请求，插件端把请求转发到<strong>本机接口</strong>后回传结果；</li> <li>节点状态默认由插件端<strong>主动推送</strong>（见第六节）：服务端首次收到推送后不再轮询 <code>/get-stat-info</code>；</li> <li>未配置反向隧道时，Jpom 行为与升级前完全一致（服务端主动拉取）。</li></ul> <h2 id="二、服务端配置"><a href="#二、服务端配置" class="header-anchor">#</a> 二、服务端配置</h2> <p>在服务端 <code>conf/application.yml</code> 中增加：</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">jpom</span><span class="token punctuation">:</span>
  <span class="token key atrule">agent</span><span class="token punctuation">:</span>
    <span class="token key atrule">tunnel</span><span class="token punctuation">:</span>
      <span class="token comment"># 连接密钥，配置后才会启用 /agent/tunnel 端点；留空表示不启用</span>
      <span class="token key atrule">key</span><span class="token punctuation">:</span> 请替换为足够复杂的随机字符串
      <span class="token comment"># 未注册节点是否允许自动注册（默认 false：直接拒绝）</span>
      <span class="token key atrule">allow-auto-register</span><span class="token punctuation">:</span> <span class="token boolean important">false</span>
      <span class="token comment"># 心跳间隔（秒）</span>
      <span class="token key atrule">heartbeat-seconds</span><span class="token punctuation">:</span> <span class="token number">5</span>
      <span class="token comment"># 插件端主动推送的数据允许的最大年龄（秒），超过按无法连接处理</span>
      <span class="token key atrule">push-max-age-seconds</span><span class="token punctuation">:</span> <span class="token number">90</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>修改后<strong>重启服务端</strong>生效。启动日志出现「反向连接隧道已启用」表示端点已就绪。</p> <blockquote><p>连接密钥要妥善保存：它是插件端接入的唯一凭据。泄露后可在服务端更换密钥并重启，旧密钥立即失效。</p></blockquote> <h2 id="三、插件端配置"><a href="#三、插件端配置" class="header-anchor">#</a> 三、插件端配置</h2> <p>在插件端 <code>conf/application.yml</code> 中增加（Java 与 Go 插件端使用<strong>同一份配置</strong>）：</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">jpom</span><span class="token punctuation">:</span>
  <span class="token key atrule">tunnel</span><span class="token punctuation">:</span>
    <span class="token comment"># 服务端隧道地址，支持 ws:// 与 wss://；可只写到主机，路径会自动补 /agent/tunnel</span>
    <span class="token key atrule">server-url</span><span class="token punctuation">:</span> wss<span class="token punctuation">:</span>//jpom.example.com
    <span class="token comment"># 与服务端 jpom.agent.tunnel.key 完全一致</span>
    <span class="token key atrule">key</span><span class="token punctuation">:</span> 请替换为与服务端相同的密钥
    <span class="token comment"># 本插件端在服务端「机器节点资产」中的标识（machineId）</span>
    <span class="token key atrule">machine-id</span><span class="token punctuation">:</span> 机器节点ID
    <span class="token comment"># 回环请求超时（秒）</span>
    <span class="token key atrule">timeout-seconds</span><span class="token punctuation">:</span> <span class="token number">30</span>
    <span class="token comment"># 是否主动推送节点状态（默认 true，关闭后服务端回退为拉取）</span>
    <span class="token key atrule">push-enabled</span><span class="token punctuation">:</span> <span class="token boolean important">true</span>
    <span class="token comment"># 主动推送间隔（秒）</span>
    <span class="token key atrule">push-interval</span><span class="token punctuation">:</span> <span class="token number">30</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>三项（<code>server-url</code>、<code>key</code>、<code>machine-id</code>）齐全才启用。日志出现 <code>tunnel connected</code> 表示已连上。</p> <h2 id="四、接入步骤"><a href="#四、接入步骤" class="header-anchor">#</a> 四、接入步骤</h2> <ol><li>服务端配置 <code>jpom.agent.tunnel.key</code> 并重启，确认日志出现「反向连接隧道已启用」；</li> <li>插件端配置上面三项并重启，确认日志出现 <code>tunnel connected</code>；</li> <li>服务端日志出现「节点 xxx 反向隧道上线」，说明通道已可用；</li> <li>机器节点资产里的 <strong>jpomUrl 不再被使用</strong>，可以留空或保留原值：只要该节点的隧道在线，服务端请求就走隧道；隧道离线时自动回退为直连（直连不通就会提示节点不可用）。</li></ol> <blockquote><p>如果开启了 <code>allow-auto-register: true</code>，未知节点标识首次连接时会自动创建一条机器节点资产记录，之后可在「资产管理」里分配工作空间、绑定为业务节点。</p></blockquote> <h2 id="五、检查与排障"><a href="#五、检查与排障" class="header-anchor">#</a> 五、检查与排障</h2> <table><thead><tr><th>现象</th> <th>排查方向</th></tr></thead> <tbody><tr><td>服务端日志没有「反向连接隧道已启用」</td> <td>检查 <code>jpom.agent.tunnel.key</code> 是否为空（空值不启用），是否已重启</td></tr> <tr><td>插件端日志报「连接密钥不正确」</td> <td>两端 <code>key</code> 不一致</td></tr> <tr><td>插件端日志报「握手签名校验未通过」</td> <td>两端系统时间相差超过 5 分钟，请校准时间</td></tr> <tr><td>插件端日志报「节点未注册」</td> <td>机器节点资产里没有该 <code>machine-id</code>；先创建，或开启 <code>allow-auto-register</code></td></tr> <tr><td>节点显示离线</td> <td>检查插件端到服务端 443/2122 的出站连通性；确认 <code>server-url</code> 的协议（<code>ws</code>/<code>wss</code>）与端口正确</td></tr></tbody></table> <p>服务端还提供三个查询接口，便于自查：</p> <ul><li><code>GET /tunnel/online</code>：返回当前通过隧道在线的机器节点标识列表；</li> <li><code>GET /tunnel/status?machineId=xxx</code>：返回指定节点是否通过隧道在线；</li> <li><code>GET /tunnel/push?machineId=xxx</code>：返回推送接收条数、持有快照的节点数；带 <code>machineId</code> 时返回该节点最新推送时间、序号与是否新鲜，用于确认推送是否到达。</li></ul> <h2 id="六、节点状态主动推送"><a href="#六、节点状态主动推送" class="header-anchor">#</a> 六、节点状态主动推送</h2> <p>插件端连上隧道后，会按 <code>push-interval</code>（默认 30 秒）把本机状态<strong>主动推送</strong>给服务端。服务端收到第一条推送后，会把该机器切换为「推送模式」并停止轮询，节点详情、监控曲线与页面展示与之前完全一致。</p> <ul><li>推送内容与 <code>/get-stat-info</code> 完全同构，不额外增加配置项；</li> <li>推送模式没有「服务端 → 节点」的请求往返，节点网络延迟显示为 <code>0</code> 是正常现象；</li> <li><strong>升级顺序：先升级服务端，再升级插件端</strong>。服务端会在握手时声明是否支持推送，未声明（老服务端）时插件端保持拉取、不发送推送帧，因此不会出现「插件端先升级把隧道推挂」的情况；</li> <li>超过 <code>jpom.agent.tunnel.push-max-age-seconds</code>（默认 90 秒）没有新推送时，节点按「无法连接」处理，并提示「节点长时间未主动上报状态」；</li> <li>连续 3 个心跳周期仍没有推送，服务端会<strong>自动回退为拉取模式</strong>（例如插件端回退到不支持推送的旧版本），无需手工改库；</li> <li>如需关闭推送，在插件端设置 <code>jpom.tunnel.push-enabled: false</code> 并重启，服务端下一轮自动回退拉取；</li> <li>同一份推送不会被重复写入统计日志：插件端间隔小于服务端监控周期时只重复刷新节点检测时间，不会在监控曲线里描重复点。</li></ul> <blockquote><p><strong>多服务端部署</strong>：推送经隧道只会到达持有该连接的实例，其它实例拿不到推送数据。为避免节点被误判离线，多服务端部署时<strong>保持拉取模式</strong>（不做推送模式切换）。</p></blockquote> <h2 id="七、注意事项"><a href="#七、注意事项" class="header-anchor">#</a> 七、注意事项</h2> <ul><li><strong>在线升级</strong>：升级会重启插件端进程，隧道会断开。反向模式下页面上的升级进度可能停在“重连中”，插件端重启并自动重连后节点恢复在线，刷新页面即可。</li> <li><strong>未注册节点</strong>：默认拒绝接入。开启自动注册只创建机器节点资产，是否作为业务节点使用仍需在服务端确认。</li> <li><strong>密钥与安全</strong>：建议使用 <code>wss://</code>（经反向代理终止 TLS）。连接密钥与插件端管理密码相互独立，可分别重置。</li></ul></div></div> <div class="page-slot page-slot-bottom">
